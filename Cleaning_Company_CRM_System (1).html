      ${r.photo ? `<div><h2>توثيق الإنجاز</h2><img src="${photoSrc(r.photo)}" alt="" style="width:52mm;height:36mm;object-fit:cover;border-radius:2mm;border:.3mm solid #ecd5df"></div>` : '<div></div>'}</div>
      <h2>رأي العميل</h2><p>☐ ممتاز &nbsp;&nbsp; ☐ جيد جدًا &nbsp;&nbsp; ☐ جيد &nbsp;&nbsp; ☐ يحتاج إلى تحسين</p><p>ملاحظات العميل: ......................................................................................................................</p>
      <p>ويقرّ العميل باستلام الأعمال أعلاه بحالة جيدة، وأن الموقع سُلِّم دون أضرار.</p>`;
    return paper({ no, title: 'محضر استلام أعمال', body, sigs: [{ label: 'المستلم (العميل)', name: r.clientName, title: '' }, { label: 'ممثل الشركة', name: staffById(r.supervisorId)?.name, title: 'مشرفة ميدانية' }, { stamp: true }] });
  },
  quote(no, o) {
    const x = db.tenders.find((y) => y.id === o.tender); if (!x) return '';
    const months = Number(x.months) || 1; const sub = sum(x.items || [], (i) => i.q * i.p); const total = sub * months; const vat = total * 0.15; const valid = Number(o.validity) || 30;
    const body = `<p><b>السادة/ ${esc(x.entity)} المحترمين</b></p><p>السلام عليكم ورحمة الله وبركاته، وبعد:</p><p>إشارة إلى ${esc(x.title)}، يسرّنا أن نقدّم لكم عرض السعر التالي لتقديم خدمات النظافة${x.scope ? `، ويشمل: ${esc(x.scope)}` : '.'}</p>
      ${dtable([{ l: 'م', n: 1 }, 'البند', { l: 'الكمية', n: 1 }, 'الوحدة', { l: 'سعر الوحدة', n: 1 }, { l: 'الإجمالي', n: 1 }], (x.items || []).map((i, k) => [k + 1, esc(i.d), i.q, esc(i.u), AD.n(i.p, 2), AD.n(i.q * i.p, 2)]), ['', months > 1 ? 'الإجمالي الشهري' : 'الإجمالي', '', '', '', AD.n(sub, 2)])}
      ${dkv([['مدة التعاقد', months > 1 ? `${months} شهرًا` : 'مقطوعية', 1], ['الإجمالي قبل الضريبة', AD.money(total)], ['ضريبة القيمة المضافة 15%', AD.money(vat)], ['الإجمالي شامل الضريبة', `<span style="color:${DOC_ROSE}">${AD.money(total + vat)}</span>`]])}
      <h2>الشروط</h2><ol><li>العرض ساري لمدة ${valid} يومًا من تاريخه.</li><li>تشمل الأسعار العمالة المدرَّبة والإشراف ومواد التنظيف ما لم يُذكر خلاف ذلك.</li><li>تُصرف المستحقات ${months > 1 ? 'شهريًا' : 'على دفعات حسب مراحل الإنجاز'} بعد تقديم الفاتورة.</li><li>تلتزم الشركة بعاملات اجتزن دورات السلامة وآداب العمل لدى العملاء.</li></ol>
      <p>نأمل أن يحظى عرضنا بقبولكم، ونسعد بالرد على أي استفسار.</p>`;
    return paper({ no, title: 'عرض سعر', subtitle: x.title, body, meta: [['المرجع', x.id]], sigs: [{ label: 'إعداد', name: me()?.name, title: me()?.title }, { label: 'اعتماد', name: db.settings.signatory, title: db.settings.signatoryTitle }, { stamp: true }] });
  },
  contract(no, o) {
    const c = db.contracts.find((y) => y.id === o.contract); if (!c) return '';
    const cl = clientById(c.clientId) || {}; const st = db.settings; const months = Math.max(1, Math.round(daysBetween(c.start, c.end) / 30.4));
    const body = `<p>إنه في يوم ${AD.day(new Date())} ${AD.date(new Date())}، تم الاتفاق بين كل من:</p>
      <p><b>الطرف الأول:</b> ${esc(st.companyAr)}${st.cr ? `، سجل تجاري رقم ${esc(st.cr)}` : ''}، وعنوانها ${esc(st.address)}، ويمثلها في التوقيع ${esc(st.signatory)} بصفتها ${esc(st.signatoryTitle)}.</p>
      <p><b>الطرف الثاني:</b> ${esc(cl.name || '')}${cl.cr ? `، سجل تجاري رقم ${esc(cl.cr)}` : ''}${cl.address ? `، وعنوانه ${esc(cl.address)}` : ''}${cl.contact ? `، ويمثله ${esc(cl.contact)}` : ''}.</p>
      <h2>البند الأول: التمهيد</h2><p>لما كان الطرف الأول متخصصًا في تقديم خدمات النظافة والتعقيم، ورغب الطرف الثاني في الاستفادة من خدماته، فقد اتفق الطرفان وهما بكامل أهليتهما المعتبرة شرعًا ونظامًا على ما يلي، ويُعد هذا التمهيد جزءًا لا يتجزأ من العقد.</p>
      <h2>البند الثاني: موضوع العقد</h2><p>يلتزم الطرف الأول بتنفيذ «${esc(c.title)}» وفق النطاق التالي:</p><ol>${(c.scope || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ol>${c.workers ? `<p>بعدد ${c.workers} عاملة${c.visits ? `، بواقع ${esc(c.visits)}` : ''}.</p>` : ''}
      <h2>البند الثالث: مدة العقد</h2><p>مدة هذا العقد ${months} شهرًا تبدأ من ${AD.date(c.start)} وتنتهي في ${AD.date(c.end)}، ويجوز تجديده باتفاق الطرفين كتابةً قبل انتهائه بثلاثين يومًا.</p>
      <h2>البند الرابع: قيمة العقد وطريقة الدفع</h2><p>قيمة العقد ${AD.money(c.value)} قبل ضريبة القيمة المضافة، وتبلغ شاملة الضريبة ${AD.money(contractTotal(c))}، وتُدفع ${esc(I18N.ar['ct.p.' + c.payTerms])} وفق الجدول التالي:</p>
      ${dtable([{ l: 'الدفعة', n: 1 }, { l: 'تاريخ الاستحقاق', n: 1 }, { l: 'المبلغ', n: 1 }], (c.payments || []).map((p, i) => [i + 1, AD.short(p.due), AD.n(p.amount, 2)]), ['', 'الإجمالي', AD.n(sum(c.payments || [], (p) => p.amount), 2)])}
      <h2>البند الخامس: التزامات الطرف الأول</h2><ol><li>توفير عاملات مدرَّبات اجتزن دورات السلامة وآداب العمل، تحت إشراف مشرفة ميدانية.</li><li>توفير مواد ومعدات التنظيف المناسبة والآمنة.</li><li>توثيق كل عمل منجز بالصورة وإتاحة تقارير دورية للطرف الثاني.</li><li>المحافظة على سرية وخصوصية موقع الطرف الثاني وممتلكاته.</li></ol>
      <h2>البند السادس: التزامات الطرف الثاني</h2><ol><li>تمكين فريق الطرف الأول من الوصول إلى مواقع العمل في الأوقات المتفق عليها.</li><li>سداد المستحقات في مواعيدها المحددة.</li><li>إبلاغ الطرف الأول كتابيًا بأي ملاحظات على مستوى الخدمة خلال ثلاثة أيام.</li></ol>
      <h2>البند السابع: إنهاء العقد</h2><p>يحق لأي من الطرفين إنهاء العقد بإشعار كتابي قبل ثلاثين يومًا، مع تسوية المستحقات حتى تاريخ الإنهاء.</p>
      <h2>البند الثامن: أحكام عامة</h2><p>يخضع هذا العقد للأنظمة المعمول بها في المملكة العربية السعودية، وأي نزاع ينشأ عنه يُحل وديًا، فإن تعذر فيُحال إلى الجهة المختصة.${c.terms ? ` ${esc(c.terms)}` : ''} حُرر هذا العقد من نسختين، بيد كل طرف نسخة للعمل بموجبها.</p>`;
    return paper({ no, title: 'عقد تقديم خدمات نظافة', subtitle: `رقم العقد ${c.id}`, body, meta: [['رقم العقد', c.id]], sigs: [{ label: 'الطرف الأول', name: st.signatory, title: st.companyAr }, { label: 'الطرف الثاني', name: cl.contact || cl.name, title: cl.name }, { stamp: true }] });
  },
  cert(no, o) {
    const e = enrollment(o.s, o.c); const s = staffById(o.s); const c = courseById(o.c); if (!e || !s || !c) return '';
    const st = db.settings;
    return `<article class="paper" dir="rtl" lang="ar"><div class="cert"><div style="width:22mm;height:22mm">${st.logo ? `<img src="${esc(st.logo)}" alt="" style="width:100%;height:100%;object-fit:contain">` : crmMark({ ink: DOC_INK, accent: DOC_ROSE, frame: DOC_ROSE })}</div><div style="font-size:11pt;color:#6b5560">${esc(st.companyAr)} · أكاديمية التدريب</div>
      <h1>شهادة إتمام تدريب</h1><p style="font-size:12pt">تشهد ${esc(st.companyAr)} بأن</p><div class="who">${esc(s.name)}${s.latin ? ` <span style="font-size:13pt;color:#6b5560;font-family:Sora,sans-serif">(${esc(s.latin)})</span>` : ''}</div>
      <p style="font-size:12pt">قد أتمّت بنجاح دورة</p><div style="font-size:17pt;font-weight:700">«${esc(c.title.ar || c.title)}»</div>
      <p style="font-size:11pt;color:#4b3540">بدرجة <b style="font-family:Sora,sans-serif">${e.score}%</b> بتاريخ ${AD.date(e.passedAt)} الموافق ${AD.hijri(e.passedAt)}</p>
      <div style="display:flex;gap:16mm;margin-top:8mm;align-items:flex-end"><div style="text-align:center;font-size:9.5pt"><div style="border-top:.3mm solid #ecd5df;padding-top:2mm;min-width:48mm">${esc(st.signatory)}<br><span style="color:#7a6470">${esc(st.signatoryTitle)}</span></div></div><div style="width:24mm;height:24mm">${qrSVG(`CRM-CERT|${e.certNo}|${s.id}|${c.id}|${e.passedAt}`)}</div><div style="text-align:center;font-size:9.5pt"><div style="border-top:.3mm solid #ecd5df;padding-top:2mm;min-width:48mm">رقم الشهادة<br><b style="font-family:Sora,sans-serif">${esc(e.certNo)}</b></div></div></div></div></article>`;
  },
  blank(no) { return `<article class="paper" dir="rtl" lang="ar">${docWatermark()}${pageFrame(`${letterhead(no)}<div class="doc-body"></div>`, docFooter(no, 'ورق رسمي'))}</article>`; },
};
ACT['doc-workorder'] = (el) => showDoc({ title: t('fm.workOrder'), type: 'أمر عمل', ref: el.dataset.id, build: (no) => FORM_DOCS.workOrder(no, { req: el.dataset.id }) });
ACT['doc-handover'] = (el) => showDoc({ title: t('fm.handover'), type: 'محضر استلام أعمال', ref: el.dataset.id, build: (no) => FORM_DOCS.handover(no, { req: el.dataset.id }) });
ACT['doc-quote'] = (el) => showDoc({ title: t('fm.quote'), type: 'عرض سعر', ref: el.dataset.id, build: (no) => FORM_DOCS.quote(no, { tender: el.dataset.id, validity: 30 }) });
ACT['doc-contract'] = (el) => showDoc({ title: t('fm.contract'), type: 'عقد تقديم خدمات', ref: el.dataset.id, build: (no) => FORM_DOCS.contract(no, { contract: el.dataset.id }) });
ACT['doc-cert'] = (el) => { const e = enrollment(el.dataset.s, el.dataset.c); showDoc({ title: t('fm.cert'), type: 'شهادة تدريب', ref: e?.certNo, build: (no) => FORM_DOCS.cert(no, { s: el.dataset.s, c: el.dataset.c }) }); };
ACT['doc-plan'] = (el) => {

      <h2>مراحل الخطة الزمنية</h2>${dtable([{ l: 'م', n: 1 }, 'المرحلة', 'المسؤولة', { l: 'من', n: 1 }, { l: 'إلى', n: 1 }, { l: 'المدة (يوم)', n: 1 }, { l: 'الإنجاز', n: 1 }], p.phases.map((ph, i) => [i + 1, esc(ph.name), esc(staffById(ph.ownerId)?.name || '—'), AD.short(ph.start), AD.short(ph.end), daysBetween(ph.start, ph.end) + 1, ph.progress + '%']))}

  } });
};

ACT['form-start'] = (el) => {
  const f = el.dataset.f;

function logoToDataURL(file, max = 512) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader(); fr.onerror = () => reject(fr.error);
    fr.onload = () => { if (file.type === 'image/svg+xml') return resolve(fr.result); const img = new Image(); img.onerror = () => reject(new Error('bad')); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); resolve(c.toDataURL('image/png')); }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

/* the one orchestrated moment: a squeegee-like wipe from sign-in into the app */
function wipeTo(hash) {
  const old = $('#app').firstElementChild;
  if (reducedMotion() || !old) { location.hash = hash; return; }
  const layer = document.createElement('div'); layer.className = 'wipe'; layer.setAttribute('aria-hidden', 'true');
  layer.appendChild(old); document.body.appendChild(layer);
  location.hash = hash;
  const rtl = isRTL(); const blade = document.createElement('i'); blade.style.cssText = `position:absolute;top:0;bottom:0;width:3px;background:linear-gradient(transparent,var(--rose-soft),transparent);box-shadow:0 0 24px 6px oklch(100% 0 0 / .6)`;
  layer.appendChild(blade);
  const kf = rtl ? [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 100% 0 0)' }] : [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 0 0 100%)' }];
  const opts = { duration: 760, easing: 'cubic-bezier(.76,0,.24,1)', fill: 'forwards' };
  layer.animate(kf, opts);
  blade.animate(rtl ? [{ right: '0%' }, { right: '100%' }] : [{ left: '0%' }, { left: '100%' }], opts).onfinish = () => { layer.remove(); SHADER.stop(); };
}

    </main></div>`;

function estimateUpdate() {
  const f = $('form[data-form=client-req]'); const v = $('#est-v'); if (!f || !v) return;
  const w = Number(f.elements.workers.value) || 1, h = Number(f.elements.hoursEst.value) || 3; const total = w * h * (Number(db.settings.clientRate) || 45) * 1.15;
  v.textContent = FMT.money(Math.round(total)); $('#est-hint').textContent = t('cp.estHint', { w: `${w} ${w === 1 ? t('cp.worker1') : t('cp.workersN')}`, h });
}
CHANGE.est = () => estimateUpdate();
FORMS['client-req'] = (f) => {
  const o = formObj(f);
  if (!o.clientName) return setInvalid(f, 'clientName', t('err.req'));
  if (!validPhone(o.clientPhone)) return setInvalid(f, 'clientPhone', t('err.phone'));
  if (!o.district) return setInvalid(f, 'district', t('err.req'));
  const r = REQ.create({ ...o, source: 'portal' }); saveDB(true);
  const st = db.settings; const msg = fill(WA_TPL.toCompany.ar, { id: r.id, svc: arSvc(r.service), name: r.clientName, phone: r.clientPhone, district: r.district, floor: r.floor, apt: r.apartment, gps: r.gps, date: AD.date(r.prefDate), period: arPer(r.period) });
  $('#cp-main').innerHTML = `<div class="client-card" style="text-align:center;max-width:620px;margin:0 auto">
    <div class="success-mark">${ring(100, 76, { label: false, tone: 'ok' })}</div><h2 style="font-size:26px">${t('cp.okT')}</h2><p class="muted mt-8">${t('cp.okP', { id: `<b class="num" style="color:var(--ink)">${r.id}</b>` })}</p>
    <div class="row-wrap mt-24" style="justify-content:center"><a class="btn btn-primary" href="#/track/${r.id}">${icon('route', 'i-sm')}${t('cp.track')}</a>${st.wa ? `<a class="btn btn-wa" target="_blank" rel="noopener" href="${waLink(st.wa, msg)}">${icon('message-circle', 'i-sm')}${t('cp.wa')}</a>` : ''}<a class="btn" href="#/client" data-act="cp-again">${t('cp.another')}</a></div></div>`;
  $('#cp-main').scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
};
ACT['cp-again'] = () => { renderPublic({ name: 'client', params: {} }); };

/* ---------- tracking ---------- */
function trackHTML(id) {
  return `<div class="client-wrap"><section class="client-hero" style="padding-bottom:140px"><canvas aria-hidden="true"></canvas><div class="shader-fallback"></div>
    <div class="client-top">${lockup(false)}<div class="row">${pubTopActions()}<a class="btn btn-sm" href="#/client">${icon('sparkles', 'i-sm')}<span class="only-desk">${t('lg.client')}</span></a></div></div>
    <div class="client-head"><h1>${t('tk.title')}</h1><p>${t('tk.lead')}</p></div></section>
    <main class="client-body"><div class="client-card" style="max-width:720px;margin:0 auto"><form data-form="track" class="form-grid" style="grid-template-columns:1fr 1fr auto;align-items:end">
      ${fld(t('req.no'), `<input class="input ltr num" name="no" required placeholder="REQ-1050" value="${esc(id || '')}">`)}${fld(t('c.phone'), '<input class="input ltr" name="phone" required inputmode="tel" placeholder="05xxxxxxxx">')}<button class="btn btn-primary" type="submit" style="min-height:44px">${t('tk.find')}</button></form><div id="tk-out"></div></div></main></div>`;
}
const norm = (p) => intlPhone(p);
FORMS.track = (f) => {
  const o = formObj(f); const r = db.requests.find((x) => x.id.toLowerCase() === String(o.no).trim().toLowerCase() && norm(x.clientPhone) === norm(o.phone));
  const out = $('#tk-out');
  if (!r) { out.innerHTML = `<p class="rq-note rework mt-16">${t('tk.notFound')}</p>`; return; }
  S.ui.trackId = r.id; out.innerHTML = trackResult(r);
};
function trackResult(r) {
  const order = ['new', 'supervisor', 'worker', 'progress', 'review', 'done']; const at = order.indexOf(r.status);
  const steps = [['new', 'ev.created', r.createdAt], ['supervisor', 'st.supervisor', r.supAt], ['worker', 'st.worker', r.workerAt], ['progress', 'st.progress', r.startedAt], ['done', 'st.done', r.approvedAt]];
  const sup = staffById(r.supervisorId);
  return `<hr class="sep"><div class="row between" style="margin-bottom:14px"><div><b class="num">${r.id}</b><div class="muted small">${esc(svcName(r.service))} · ${esc(reqWhen(r))}</div></div>${stChip(r.status)}</div>
    ${r.status === 'cancelled' ? `<p class="rq-note">${t('ev.cancel')}</p>` : `<ol class="steps">${steps.map(([s, k, d]) => { const idx = order.indexOf(s); const on = at >= idx || (s === 'done' && r.status === 'done'); const now = !on && order[at + 1] === s; return `<li class="${on ? 'on' : now ? 'now' : ''}"><span class="s-dot">${icon(on ? 'check' : now ? 'hourglass' : 'circle-dot', 'i-sm')}</span><div><b>${t(k)}</b><small>${d ? FMT.dt(d) : '—'}</small></div></li>`; }).join('')}</ol>`}
    ${sup ? `<p class="small mt-16">${t('tk.yourSup')}: <b>${esc(sup.name.split(' ')[0])}</b></p>` : ''}
    ${r.status === 'done' && r.photo ? `<img class="photo mt-16" src="${photoSrc(r.photo)}" alt="${t('req.photo')}">` : ''}
    ${r.status === 'done' ? (r.rating ? `<p class="rq-note mt-16">${t('tk.thanks')} · ${'★'.repeat(r.rating.stars)}</p>` : `<form data-form="rate" data-id="${r.id}" class="stack mt-16"><b>${t('tk.rateT')}</b><div class="stars" role="radiogroup">${[1, 2, 3, 4, 5].map((i) => `<button type="button" data-act="star" data-v="${i}" aria-label="${i}/5">${icon('star')}</button>`).join('')}</div><input type="hidden" name="stars" value="0">${fld(t('tk.comment'), '<textarea class="textarea" name="comment" rows="2" style="min-height:64px"></textarea>')}<button class="btn btn-primary" type="submit">${t('tk.rateSend')}</button></form>`) : ''}`;
}
ACT.star = (el) => { const v = +el.dataset.v; const f = el.closest('form'); f.elements.stars.value = v; $$('.stars button', f).forEach((b) => b.classList.toggle('on', +b.dataset.v <= v)); };
FORMS.rate = (f) => { const o = formObj(f); const r = reqById(f.dataset.id); const n = Number(o.stars); if (!n) return; r.rating = { stars: n, comment: o.comment || '', at: new Date().toISOString() }; REQ.log(r, { t: 'rate', n }); saveDB(true); $('#tk-out').innerHTML = trackResult(r); toast(t('tk.thanks')); };

/* ===== 99 · boot ===== */
function boot() {
  db = loadDB(); saveDB(true);
  if (!['ar', 'en', 'hi', 'tl'].includes(S.lang)) S.lang = 'ar';
  if (S.userId && !staffById(S.userId)) { S.userId = null; LS.del('crmclean.user'); }
  applyDoc();
  router();
  if (db.migrated) { delete db.migrated; saveDB(true); setTimeout(() => toast(S.lang === 'ar' ? 'تم نقل بيانات النسخة السابقة إلى النظام الجديد' : 'Data from the previous version was carried over', 'info', { ms: 6000 }), 600); }
}
/* another tab (e.g. the client portal) changed the data — refresh this one */
window.addEventListener('storage', (e) => {
  if (e.key !== DB_KEY || !e.newValue) return;
  const before = new Set(db.requests.map((r) => r.id));
  try { db = loadDB(); } catch (err) { return; }
  const fresh = db.requests.filter((r) => !before.has(r.id));
  const u = me();
  if (!u) return;
  if (u.role === 'worker') { router(); return; }
  if (['login', 'client', 'track'].includes(S.view)) return;
  renderView(); refreshChrome();
  if (fresh.length && u.role === 'admin') toast((S.lang === 'ar' ? 'طلب جديد ' : 'New request ') + fresh[0].id + ' · ' + fresh[0].clientName, 'info', { action: { label: t('c.view'), fn: () => (location.hash = '#/request/' + fresh[0].id) }, ms: 7000 });
});
boot();

</script>
