/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}

button{cursor:pointer}
img,svg{display:block;max-width:100%}

::selection{background:var(--petal-2);color:var(--ink)}

.modal:focus,.drawer-panel:focus,.view:focus{outline:none}

.i-sm{width:16px;height:16px}.i-lg{width:24px;height:24px}.i-xl{width:32px;height:32px;stroke-width:1.5}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--ink-3)}
.ink2{color:var(--ink-2)}
.small{font-size:13px}.tiny{font-size:12px}
.b{font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.row-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}

.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.sep{height:1px;background:var(--line);border:0;margin:16px 0}

/* ---------- buttons ---------- */
.btn{--h:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--h);padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:14.5px;line-height:1;white-space:nowrap;text-decoration:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:background-color var(--t-fast) var(--ease-out-quart),border-color var(--t-fast) var(--ease-out-quart),color var(--t-fast),transform var(--t-press) var(--ease-out-quart),box-shadow var(--t-fast)}

.btn-ok{background:var(--ok);border-color:transparent;color:#fff}

.btn-sm{--h:34px;padding:0 12px;font-size:13.5px;border-radius:9px}

.btn-block{width:100%}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.field>label{font-size:13.5px;font-weight:700;color:var(--ink-2)}

.input,.select,.textarea{width:100%;min-height:44px;padding:10px 13px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);outline:0;transition:border-color var(--t-fast),box-shadow var(--t-fast)}

.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--rose);margin:0}
.input-group{display:flex;gap:8px}
.input-group .input{flex:1}
input[type=range]{accent-color:var(--rose);width:100%}

/* segmented control */
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:13px;background:var(--bg-2);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}

/* tabs with sliding indicator */
.tabs{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{position:relative;border:0;background:none;padding:10px 14px 12px;font-weight:700;font-size:14.5px;color:var(--ink-3);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;transition:color var(--t-fast)}

/* ---------- chips & status ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-full);font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--petal);color:var(--ink-2)}

.chip-rose{background:var(--petal);color:var(--rose-hover)}

.chip-ok{background:var(--ok-bg);color:var(--ok)}
.chip-warn{background:var(--warn-bg);color:var(--warn)}
.chip-bad{background:var(--bad-bg);color:var(--bad)}
.chip-info{background:var(--info-bg);color:var(--info)}

.st-new{background:var(--st-new-bg);color:var(--st-new-fg);--d:var(--st-new-dot)}
.st-supervisor{background:var(--st-sup-bg);color:var(--st-sup-fg);--d:var(--st-sup-dot)}
.st-worker{background:var(--st-wrk-bg);color:var(--st-wrk-fg);--d:var(--st-wrk-dot)}
.st-progress{background:var(--st-prg-bg);color:var(--st-prg-fg);--d:var(--st-prg-dot)}
.st-review{background:var(--st-rev-bg);color:var(--st-rev-fg);--d:var(--st-rev-dot)}
.st-done{background:var(--st-done-bg);color:var(--st-done-fg);--d:var(--st-done-dot)}

/* ---------- layout: shell ---------- */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg-2);border-inline-end:1px solid var(--line);padding:18px 14px 14px;z-index:var(--z-nav)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{width:42px;height:42px;flex:none;display:grid;place-items:center}
.brand-mark svg,.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-text{min-width:0;display:flex;flex-direction:column;gap:3px}
.brand-word{height:15px;width:auto;color:var(--ink)}
.brand-word svg{height:100%;width:auto;fill:currentColor}
.brand-name{font-size:12.5px;color:var(--ink-3);line-height:1.35;font-weight:700}

.nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:4px 2px;scrollbar-width:thin}

@media (hover:hover) and (pointer:fine){
  .nav-item:hover:not([aria-current=page]){background:var(--petal);color:var(--ink)}
  .nav-item:hover .i{transform:translateY(-1px) rotate(-6deg)}
}
.side-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.me{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:12px}
.me .grow{line-height:1.35}
.me b{display:block;font-size:14px}
.me small{color:var(--ink-3);font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:var(--z-top);display:flex;align-items:center;gap:12px;padding:14px 32px;background:color-mix(in oklch,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color var(--t-base)}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .tb-title{min-width:0;flex:1;opacity:0;transform:translateY(4px);transition:opacity var(--t-base) var(--ease-out-quart),transform var(--t-base) var(--ease-out-quart)}
.topbar.scrolled .tb-title{opacity:1;transform:none}
.topbar h1{font-size:22px}
.topbar .tb-sub{display:none}
.tb-actions{display:flex;align-items:center;gap:4px}
.search-trigger{display:flex;align-items:center;gap:10px;height:42px;min-width:250px;padding:0 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);font-size:14px;margin-inline-end:6px}
.search-trigger kbd{margin-inline-start:auto;font:600 11px var(--font-num);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--ink-3)}
.view{padding:8px 32px 56px;width:100%;max-width:1480px;margin-inline:auto;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:10px 0 22px}
.page-head h2{font-size:26px}
.page-head p{color:var(--ink-3);margin-top:4px;font-size:14.5px}
.tabbar{display:none}
.only-mobile{display:none!important}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.panel-pad{padding:20px 22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:16.5px;display:flex;align-items:center;gap:10px}
.panel-head h3 .sq{width:8px;height:8px;background:var(--rose-mark);border-radius:2px;flex:none}
.panel-head p{font-size:13px;color:var(--ink-3)}
.panel-body{padding:18px 22px}
.panel-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cols{display:grid;gap:20px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols-8-4{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.cols-7-5{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.gap-24{gap:24px}

.filters{display:flex;flex-direction:column;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line)}
.filters .row{gap:10px}
.filters .grow .input{width:100%}
/* list rows */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-width:0;transition:background-color var(--t-fast)}
.li:last-child{border-bottom:0}
.li .grow b{display:block;font-size:14.5px;line-height:1.45}
.li .grow small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.5}
button.li{width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);font:inherit}
@media (hover:hover) and (pointer:fine){a.li:hover,button.li:hover{background:var(--surface-2)}}
.av{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--petal);color:var(--rose-hover);letter-spacing:0}
:root[data-theme="dark"] .av{color:var(--ink)}
.av-sm{width:30px;height:30px;border-radius:9px;font-size:12px}
.av-lg{width:56px;height:56px;border-radius:16px;font-size:19px}
.av.h1{background:oklch(94% .04 300);color:oklch(42% .12 300)}
.av.h2{background:oklch(94% .04 200);color:oklch(40% .08 205)}
.av.h3{background:oklch(95% .05 80);color:oklch(45% .1 70)}
.av.h4{background:oklch(94% .04 155);color:oklch(40% .1 155)}
:root[data-theme="dark"] .av.h1,:root[data-theme="dark"] .av.h2,:root[data-theme="dark"] .av.h3,:root[data-theme="dark"] .av.h4{background:var(--petal);color:var(--ink)}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{text-align:start;font-size:12.5px;font-weight:700;color:var(--ink-3);padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl th:first-child{border-start-start-radius:0}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background-color var(--t-fast)}
.tbl tbody tr[data-act]{cursor:pointer}
@media (hover:hover) and (pointer:fine){.tbl tbody tr:hover{background:var(--surface-2)}}
.tbl .t-strong{font-weight:700}
.tbl .nw{white-space:nowrap}
.tbl .more-row td{text-align:center;padding:10px}
.tbl .t-sub{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.tbl td.num,.tbl th.num{text-align:end}
.tbl .actions{display:flex;gap:6px;justify-content:flex-end}
.tbl tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line-2)}

/* meters */
.meter{height:8px;border-radius:8px;background:var(--petal);overflow:hidden;position:relative}
.meter>span{position:absolute;inset-block:0;inset-inline-start:0;border-radius:8px;background:var(--rose-mark);transition:width 600ms var(--ease-out-expo)}
.meter.warn>span{background:var(--st-rev-dot)}
.meter.bad>span{background:var(--bad)}
.meter.ok>span{background:var(--st-done-dot)}

/* C-arc progress ring (echoes the CRM mark) */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{width:100%;height:100%;overflow:visible}
.ring .trk{stroke:var(--petal);fill:none}
.ring .val{stroke:var(--rose-mark);fill:none;transition:stroke-dasharray 700ms var(--ease-out-expo)}
.ring .sqm{fill:var(--rose-mark)}
.ring b{position:absolute;font:700 13px var(--font-num);color:var(--ink)}
.ring.ok .val{stroke:var(--st-done-dot)}.ring.ok .sqm{fill:var(--st-done-dot)}
.ring.warn .val{stroke:var(--st-rev-dot)}

/* empty states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 20px;color:var(--ink-3)}
.empty .em-ill{width:84px;height:84px}
.empty h4{font-size:16px;color:var(--ink)}
.empty p{max-width:42ch;font-size:14px}

/* ---------- dashboard flow strip ---------- */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.flow a{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px;text-decoration:none;color:inherit;border-inline-end:1px solid var(--line);transition:background-color var(--t-fast)}
.flow a:last-child{border-inline-end:0}
.flow a::after{content:"";position:absolute;top:50%;inset-inline-end:-6px;width:10px;height:10px;background:var(--surface);border-top:1px solid var(--line);border-inline-end:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
[dir=rtl] .flow a::after{transform:translateY(-50%) rotate(-45deg)}
.flow a:last-child::after{display:none}
.flow .fl-top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.flow .fl-top::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--d)}
.flow .fl-n{font:600 34px/1.1 var(--font-num);letter-spacing:-.02em;color:var(--ink)}
.flow .fl-sub{font-size:12px;color:var(--ink-3)}
.flow .f-new{--d:var(--st-new-dot)}.flow .f-supervisor{--d:var(--st-sup-dot)}.flow .f-worker{--d:var(--st-wrk-dot)}.flow .f-progress{--d:var(--st-prg-dot)}.flow .f-review{--d:var(--st-rev-dot)}.flow .f-done{--d:var(--st-done-dot)}
.flow a.hot{background:linear-gradient(var(--st-new-bg),var(--st-new-bg)) top/100% 3px no-repeat}
@media (hover:hover) and (pointer:fine){.flow a:hover{background-color:var(--surface-2)}}

.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 20px}
.greet h2{font-size:28px}
.greet .date{color:var(--ink-3);font-size:14px;margin-top:2px}

/* alerts */
.alert-row{display:flex;gap:12px;align-items:flex-start;padding:13px 22px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.alert-row:last-child{border-bottom:0}
.alert-row .a-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--petal);color:var(--rose)}
.alert-row .a-ic.warn{background:var(--warn-bg);color:var(--warn)}
.alert-row .a-ic.bad{background:var(--bad-bg);color:var(--bad)}
.alert-row .a-ic.info{background:var(--info-bg);color:var(--info)}
.alert-row b{display:block;font-size:14px;line-height:1.5}
.alert-row small{color:var(--ink-3);font-size:12.5px}
@media (hover:hover) and (pointer:fine){a.alert-row:hover{background:var(--surface-2)}}

/* charts */
.chart{position:relative}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{fill:var(--ink-3);font:500 11px var(--font-num)}
.chart .bar{fill:var(--rose-mark);transition:opacity var(--t-fast)}
.chart .bar.today{fill:var(--rose)}
.chart .hit{fill:transparent}
.chart .lbl{fill:var(--ink-2);font:600 11px var(--font-num)}
.chart:hover .bar{opacity:.55}
.chart .bar.on{opacity:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.45;padding:7px 10px;border-radius:9px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity var(--t-fast);z-index:5}
.tip b{font-family:var(--font-num)}
.tip.on{opacity:1}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(110px,32%) 1fr auto;align-items:center;gap:12px;font-size:13.5px}
.hbar .meter{height:10px}
.hbar .v{font:600 13px var(--font-num);min-width:28px;text-align:end}

/* ---------- request cards (mobile lists, portals) ---------- */
.cards{display:grid;gap:14px}
.rq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden;display:flex;flex-direction:column}
.rq-body{flex:1}
.rq-head{display:flex;align-items:center;gap:10px;padding:14px 18px 0}
.rq-id{font:600 13px var(--font-num);color:var(--ink-3)}
.rq-body{padding:10px 18px 16px;display:flex;flex-direction:column;gap:8px}
.rq-title{font-size:16.5px;font-weight:700;line-height:1.4}
.rq-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink-2)}
.rq-meta span{display:inline-flex;align-items:center;gap:6px}
.rq-meta .i{width:16px;height:16px;color:var(--ink-3)}
.rq-note{font-size:13.5px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:8px 12px;color:var(--ink-2)}
.rq-note.rework{background:var(--st-rev-bg);border-color:transparent;color:var(--st-rev-fg)}
.rq-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.rq-actions .btn{flex:1 1 auto}
.timer{font:600 13px var(--font-num);display:inline-flex;align-items:center;gap:6px;color:var(--st-prg-fg);background:var(--st-prg-bg);border-radius:8px;padding:3px 9px}
.photo{border-radius:var(--r-md);overflow:hidden;background:var(--petal);aspect-ratio:4/3;width:100%;max-width:320px;object-fit:cover}
.photo-sm{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--petal);flex:none}

/* stepper (request timeline — a true sequence) */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{position:relative;display:flex;gap:14px;padding-bottom:18px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;top:26px;bottom:2px;inset-inline-start:12px;width:2px;background:var(--line);border-radius:2px}
.steps li:last-child::before{display:none}
.steps .s-dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--bg-2);border:1px solid var(--line-2);color:var(--ink-3);position:relative;z-index:1}
.steps .s-dot .i{width:14px;height:14px}
.steps li.on .s-dot{background:var(--rose);border-color:transparent;color:var(--on-rose)}
.steps li.on::before{background:var(--rose-soft)}
.steps li.now .s-dot{background:var(--surface);border:2px solid var(--rose);color:var(--rose)}
.steps b{display:block;font-size:14px;line-height:1.5}
.steps small{color:var(--ink-3);font-size:12.5px}

/* key/value grid */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.kv div small{display:block;font-size:12px;color:var(--ink-3);font-weight:700}
.kv div b{font-size:14.5px;font-weight:700;word-break:break-word}
.kv .full{grid-column:1/-1}
.stat-line{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.stat-line>div{background:var(--surface);padding:14px 16px}
.stat-line small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:700}
.stat-line b{font:600 22px/1.3 var(--font-num)}
.stat-line b .u{font:700 12px var(--font);color:var(--ink-3);margin-inline-start:4px}

/* ---------- overlays: modal / drawer / sheet ---------- */
.ov{position:fixed;inset:0;z-index:var(--z-modal);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:20px}
.ov-scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity var(--t-base) var(--ease-out-quart)}
.ov.open .ov-scrim{opacity:1}
.modal{position:relative;min-width:0;justify-self:center;width:min(640px,100%);max-height:min(88dvh,900px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-3);opacity:0;transform:translateY(10px) scale(.97);transition:opacity var(--t-base) var(--ease-out-quint),transform var(--t-base) var(--ease-out-quint)}
.ov.open .modal{opacity:1;transform:none}
.ov.closing .modal{opacity:0;transform:scale(.98);transition-duration:var(--t-fast)}
.ov.closing .ov-scrim{opacity:0;transition-duration:var(--t-fast)}
.modal.sm{width:min(440px,100%)}
.modal.lg{width:min(860px,100%)}
.modal.xl{width:min(1040px,100%)}
.m-head{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 14px}
.m-head h3{font-size:19px;flex:1}
.m-head p{font-size:13.5px;color:var(--ink-3);margin-top:4px}
.m-body{padding:4px 24px 20px;overflow-y:auto;overscroll-behavior:contain}
.m-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 24px 20px;border-top:1px solid var(--line)}
.ov.drawer{place-items:stretch;justify-items:end;padding:0}
.drawer-panel{position:relative;min-width:0;width:min(560px,100%);height:100dvh;display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--sh-3);transform:translateX(100%);transition:transform var(--t-slow) var(--ease-drawer)}
[dir=rtl] .drawer-panel{transform:translateX(-100%)}
.ov.open .drawer-panel{transform:none}
.ov.closing .drawer-panel{transition-duration:240ms;transition-timing-function:var(--ease-in-out-cubic)}
[dir=ltr] .ov.closing .drawer-panel{transform:translateX(100%)}
[dir=rtl] .ov.closing .drawer-panel{transform:translateX(-100%)}
.drawer-panel.wide{width:min(760px,100%)}
.drawer-panel .m-body{flex:1;padding-top:8px}
.grab{display:none}

/* toasts (Sonner-like stack) */
.toasts{position:fixed;z-index:var(--z-toast);bottom:22px;inset-inline-start:50%;display:flex;flex-direction:column-reverse;gap:8px;width:min(400px,calc(100vw - 32px));transform:translateX(-50%);pointer-events:none}
[dir=rtl] .toasts{transform:translateX(50%)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--surface);box-shadow:var(--sh-3);font-size:14px;font-weight:700;opacity:0;transform:translateY(16px) scale(.98);transition:opacity 280ms var(--ease-out-quint),transform 380ms var(--ease-out-quint)}
.toast.in{opacity:1;transform:none}
.toast.out{opacity:0;transform:translateY(8px) scale(.98);transition-duration:180ms}
.toast .t-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:oklch(100% 0 0 / .12)}
.toast.ok .t-ic{background:var(--st-done-dot);color:#fff}
.toast.err .t-ic{background:var(--bad);color:#fff}
.toast .t-act{margin-inline-start:auto;background:oklch(100% 0 0 / .14);border:0;color:inherit;font-weight:700;border-radius:9px;padding:5px 10px;font-size:13px}

/* popover (notifications) */
.pop{position:fixed;z-index:var(--z-pop);width:min(380px,calc(100vw - 24px));max-height:70dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-3);opacity:0;transform:scale(.96);transition:opacity var(--t-fast) var(--ease-out-quart),transform var(--t-fast) var(--ease-out-quart)}
.pop.open{opacity:1;transform:none}
.pop-head{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:space-between}

/* command palette */
.cmd{width:min(620px,100%);align-self:start;margin-top:10vh}
.cmd-input{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.cmd-input input{flex:1;border:0;outline:0;background:transparent;font-size:17px;min-width:0}
.cmd-list{max-height:min(56dvh,520px);overflow-y:auto;padding:8px}
.cmd-group{font-size:12px;font-weight:700;color:var(--ink-3);padding:10px 12px 6px}
.cmd-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:inherit;cursor:pointer}
.cmd-item[aria-selected=true]{background:var(--petal)}
.cmd-item small{color:var(--ink-3);font-size:12.5px}

/* ---------- kanban (tenders) ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;align-items:start}
.kcol{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.kcol-head{display:flex;align-items:center;gap:8px;padding:4px 6px 6px;font-weight:700}
.kcol-head .st{height:24px}
.kcol-head small{margin-inline-start:auto;color:var(--ink-3);font:600 12.5px var(--font-num)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:8px;text-align:start;width:100%}
.kcard .k-entity{font-size:12.5px;color:var(--ink-3);font-weight:700}
.kcard .k-title{font-weight:700;line-height:1.45}
.kcard .k-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.kcard .k-val{font:600 15px var(--font-num)}
@media (hover:hover) and (pointer:fine){.kcard:hover{border-color:var(--rose-soft)}}

/* ---------- gantt (project plan) ---------- */
.gantt{position:relative;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.g-scale{position:relative;height:34px;border-bottom:1px solid var(--line);background:var(--surface-2);margin-inline-start:var(--g-label)}
.g-tick{position:absolute;top:0;bottom:0;border-inline-start:1px solid var(--line);font:600 11px var(--font-num);color:var(--ink-3);padding:8px 6px;white-space:nowrap}
.g-rows{position:relative}
.g-row{display:grid;grid-template-columns:var(--g-label) 1fr;align-items:center;min-height:52px;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-label{padding:8px 14px;font-size:13.5px;font-weight:700;line-height:1.4;border-inline-end:1px solid var(--line);min-width:0}
.g-label small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.g-track{position:relative;height:100%;min-height:52px}
.g-bar{position:absolute;top:14px;height:24px;border-radius:7px;background:var(--petal-2);overflow:hidden;display:flex;align-items:center;min-width:6px}
.g-bar>i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--rose-mark);border-radius:7px}
.g-bar>span{position:relative;font:700 11.5px var(--font-num);color:var(--ink);padding-inline:8px;white-space:nowrap}
.g-bar.done{background:var(--st-done-bg)}.g-bar.done>i{background:var(--st-done-dot)}
.g-bar.late{background:var(--bad-bg);box-shadow:inset 0 0 0 1.5px var(--bad)}.g-bar.late>i{background:var(--bad)}
.g-bar.late>span{color:var(--ink)}
.g-today{position:absolute;top:0;bottom:0;width:0;border-inline-start:2px solid var(--rose);z-index:2;pointer-events:none}
.g-today::before{content:"";position:absolute;top:-1px;inset-inline-start:-5px;width:8px;height:8px;background:var(--rose);border-radius:2px}
.g-grid{position:absolute;inset:0;margin-inline-start:var(--g-label);pointer-events:none}
.g-grid i{position:absolute;top:0;bottom:0;border-inline-start:1px dashed var(--line)}

/* project rows */
.prj{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.prj:last-child{border-bottom:0}
.prj h4{font-size:16px;line-height:1.45}
.prj .p-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-3);font-size:13px;margin-top:2px}
.prj .p-phases{display:flex;gap:3px;margin-top:10px;max-width:520px}
.prj .p-phases i{flex:1;height:6px;border-radius:2px;background:var(--petal)}
.prj .p-phases i.done{background:var(--st-done-dot)}
.prj .p-phases i.act{background:var(--rose-mark)}
.prj .p-phases i.late{background:var(--bad)}
@media (hover:hover) and (pointer:fine){a.prj:hover{background:var(--surface-2)}}

/* training */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.course{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-1);text-align:start;color:inherit;font:inherit;width:100%}
.course .c-top{display:flex;gap:14px;align-items:flex-start}
.course h4{font-size:16px;line-height:1.45}
.course .c-meta{display:flex;flex-wrap:wrap;gap:6px}
.course .c-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--petal);color:var(--rose);flex:none}
@media (hover:hover) and (pointer:fine){button.course:hover{border-color:var(--rose-soft)}}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:start}
.mx{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;font:700 11px var(--font-num)}
.mx-pass{background:var(--st-done-bg);color:var(--st-done-fg)}
.mx-prog{background:var(--st-prg-bg);color:var(--st-prg-fg)}
.mx-none{border:1.5px dashed var(--line-2)}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.lesson h3{font-size:20px;margin-bottom:10px}
.lesson p{font-size:16px;line-height:1.9;color:var(--ink-2)}
.lesson ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.lesson li{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:15px}
.lesson li::before{content:"";width:9px;height:9px;margin-top:9px;background:var(--rose-mark);border-radius:2px;flex:none}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--petal-2)}
.dots i.on{background:var(--rose)}
.quiz-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px;border-radius:var(--r-md);border:1.5px solid var(--line-2);background:var(--surface);font-weight:700;font-size:15px;transition:border-color var(--t-fast),background-color var(--t-fast)}
.quiz-opt .qk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg-2);font:700 13px var(--font-num);flex:none}
.quiz-opt[aria-pressed=true]{border-color:var(--rose);background:var(--petal)}
.quiz-opt.right{border-color:var(--st-done-dot);background:var(--st-done-bg)}
.quiz-opt.wrong{border-color:var(--bad);background:var(--bad-bg)}

/* service tiles (client portal) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:var(--r-md);border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;font-size:14px;line-height:1.4;transition:border-color var(--t-fast),background-color var(--t-fast),transform var(--t-press) var(--ease-out-quart)}
.tile:active{transform:scale(.98)}
.tile input{position:absolute;opacity:0;pointer-events:none}
.tile .t-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--petal);color:var(--rose)}
.tile:has(input:checked){border-color:var(--rose);background:var(--petal)}
.tile:has(input:checked) .t-ic{background:var(--rose);color:var(--on-rose)}
.tile:has(input:focus-visible){outline:2px solid var(--rose);outline-offset:2px}
.stars{display:flex;gap:6px;direction:ltr}
.stars button{border:0;background:none;padding:2px;color:var(--line-2)}
.stars button.on{color:oklch(76% .16 75)}
.stars .i{width:30px;height:30px;fill:currentColor}

/* ---------- public screens: login / client / track ---------- */
.pub{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(420px,.9fr)}
.pub-hero{position:relative;overflow:hidden;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding:40px 48px;isolation:isolate}
.pub-hero canvas,.pub-hero .shader-fallback{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.shader-fallback{background:radial-gradient(60% 50% at 70% 30%,oklch(88% .07 355),transparent 70%),radial-gradient(50% 60% at 20% 80%,oklch(90% .05 320),transparent 70%),oklch(96% .025 352)}
:root[data-theme="dark"] .shader-fallback{background:radial-gradient(60% 50% at 70% 30%,oklch(35% .1 355),transparent 70%),radial-gradient(50% 60% at 20% 80%,oklch(30% .08 320),transparent 70%),oklch(18% .03 350)}
.lockup{display:flex;align-items:center;gap:16px;color:var(--ink)}
.lockup .brand-mark{width:56px;height:56px}
.lockup .brand-word{height:22px}
.lockup .tag{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:4px}
.hero-copy{max-width:560px}
.hero-copy h1{font-size:clamp(34px,4.2vw,58px);line-height:1.15;letter-spacing:-.01em}
.hero-copy p{font-size:18px;color:var(--ink-2);margin-top:14px;max-width:44ch}
.hero-foot{display:flex;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;font-weight:700}
.hero-foot span{display:inline-flex;align-items:center;gap:7px;background:color-mix(in oklch,var(--surface) 70%,transparent);border-radius:var(--r-full);padding:6px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pub-side{display:flex;flex-direction:column;justify-content:center;padding:40px clamp(24px,5vw,72px);background:var(--surface);position:relative}
.pub-side .ps-top{position:absolute;top:22px;inset-inline:clamp(24px,5vw,72px);display:flex;justify-content:flex-end;gap:6px}
.login-box{width:100%;max-width:420px;margin-inline:auto}
.login-box h2{font-size:26px}
.login-box>p{color:var(--ink-3);margin:6px 0 24px}
.acc-list{display:grid;gap:8px;max-height:min(44dvh,360px);overflow:auto;padding:2px;margin-top:12px}
.acc:has(input:focus-visible){outline:2px solid var(--rose);outline-offset:2px}
.pin-label{display:block;text-align:center;font-size:13px;font-weight:700;color:var(--ink-2);margin-top:18px}
.acc{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);text-align:start;font:inherit;color:inherit;transition:border-color var(--t-fast),background-color var(--t-fast)}
.acc[aria-pressed=true]{border-color:var(--rose);background:var(--petal)}
.acc .grow b{display:block;font-size:14.5px;line-height:1.4}
.acc .grow small{color:var(--ink-3);font-size:12.5px}
@media (hover:hover) and (pointer:fine){.acc:hover{border-color:var(--rose-soft)}}
.pin{display:flex;gap:10px;justify-content:center;direction:ltr;margin:6px 0 4px}
.pin input{width:54px;height:58px;text-align:center;font:600 24px var(--font-num);border-radius:var(--r-md);border:1.5px solid var(--line-2);background:var(--surface);outline:0;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.pin input:focus{border-color:var(--rose);box-shadow:0 0 0 4px var(--focus)}
.pin.shake{animation:shake 360ms var(--ease-out-quart)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.demo-note{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:12px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px;margin:22px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.client-wrap{min-height:100dvh;background:var(--bg)}
.client-hero{position:relative;overflow:hidden;isolation:isolate;padding:28px clamp(16px,4vw,48px) 120px}
.client-hero canvas,.client-hero .shader-fallback{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.client-top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1080px;margin:0 auto}
.client-head{max-width:1080px;margin:48px auto 0}
.client-head h1{font-size:clamp(30px,4.6vw,52px);line-height:1.2;max-width:18ch}
.client-head p{font-size:17px;color:var(--ink-2);margin-top:10px;max-width:52ch}
.client-body{max-width:1080px;margin:-84px auto 0;padding:0 clamp(16px,4vw,48px) 64px;position:relative}
.client-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-2);padding:clamp(20px,3vw,34px)}
.client-card h3{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.client-card h3 .step-n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--rose);color:var(--on-rose);font:600 13px var(--font-num)}
.estimate{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-radius:var(--r-md);background:var(--petal);font-weight:700}
.estimate b{font:600 22px var(--font-num)}
.success-mark{width:76px;height:76px;margin:0 auto 12px}

/* wipe transition (login → app) */
.wipe{position:fixed;inset:0;z-index:200;pointer-events:none;background:var(--bg);clip-path:inset(0 0 0 0)}
.wipe::after{content:"";position:absolute;top:0;bottom:0;width:120px;background:linear-gradient(90deg,transparent,oklch(100% 0 0 / .85),transparent)}

/* ---------- worker portal ---------- */
.w-shell{min-height:100dvh;background:var(--bg)}
.w-top{position:sticky;top:0;z-index:var(--z-top);display:flex;align-items:center;gap:12px;padding:12px 18px;background:color-mix(in oklch,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.w-main{max-width:720px;margin:0 auto;padding:18px 16px 110px}
.w-hello{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.w-hello h2{font-size:22px}
.w-tabs{position:fixed;bottom:0;inset-inline:0;z-index:var(--z-nav);display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in oklch,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.w-tabs a{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:12px;text-decoration:none;color:var(--ink-3);font-size:12.5px;font-weight:700}
.w-tabs a[aria-current=page]{color:var(--rose);background:var(--petal)}
.lang-pick{display:flex;gap:6px;flex-wrap:wrap}
.lang-pick button{border:1.5px solid var(--line-2);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13.5px}
.lang-pick button[aria-pressed=true]{border-color:var(--rose);background:var(--petal);color:var(--rose-hover)}

/* ---------- official documents ---------- */
.doc-stage{background:var(--bg-2);border-radius:var(--r-lg);padding:20px;overflow:auto;max-height:70dvh}
.doc-scale{transform-origin:top center;margin:0 auto;width:210mm}
[dir=rtl] .doc-scale{transform-origin:top center}
.paper{--doc-ink:#24101b;--doc-rose:#c83075;--doc-petal:#fde8f0;--doc-line:#ecd5df;width:210mm;min-height:297mm;margin:0 auto;background:#fff;color:var(--doc-ink);padding:13mm 15mm 12mm;box-shadow:0 2px 6px rgba(60,20,40,.08),0 24px 60px -24px rgba(60,20,40,.35);position:relative;font-size:10pt;line-height:1.68;display:flex;flex-direction:column;overflow:hidden}
.paper *{color-adjust:exact;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:.035;z-index:0}
.paper .wm svg{width:120mm;height:120mm}
.paper>*:not(.wm){position:relative;z-index:1}
.lh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8mm;padding-bottom:4mm}
.lh .lh-ar{text-align:right;direction:rtl}
.lh .lh-en{text-align:left;direction:ltr;font-family:"Sora","Readex Pro",sans-serif}
.lh .lh-name{font-weight:700;font-size:12.5pt;line-height:1.35}
.lh .lh-en .lh-name{font-size:10.5pt;letter-spacing:.01em}
.lh .lh-tag{font-size:8.5pt;color:#6b5560}
.lh .lh-reg{font-size:8pt;color:#6b5560;margin-top:1.5mm}
.lh .lh-logo{display:flex;flex-direction:column;align-items:center;gap:2mm}
.lh .lh-logo .lm{width:17mm;height:17mm}
.lh .lh-logo .lw{height:4.2mm;color:var(--doc-ink)}
.lh .lh-logo .lw svg{height:100%;width:auto;fill:currentColor}
.lh .lh-logo img{max-width:34mm;max-height:20mm;object-fit:contain}
.lh-rule{display:flex;align-items:center;gap:3mm;margin-bottom:4mm}
.lh-rule::before,.lh-rule::after{content:"";height:.6mm;flex:1;background:var(--doc-rose)}
.lh-rule::after{height:.25mm;background:var(--doc-line)}
.lh-rule i{width:2.6mm;height:2.6mm;border:.4mm solid var(--doc-rose);transform:rotate(45deg);flex:none}
.doc-meta{display:flex;flex-wrap:wrap;gap:2mm 8mm;font-size:9pt;color:#4b3540;margin-bottom:5mm}
.doc-meta b{color:var(--doc-ink);font-family:"Sora","Bahij Janna",sans-serif;font-weight:600}
.doc-title{text-align:center;margin:0 0 5mm}
.doc-title h1{font-size:16pt;line-height:1.4;display:inline-block;padding:1.5mm 8mm;border:.35mm solid var(--doc-line);border-radius:2mm;background:var(--doc-petal)}
.doc-title p{font-size:9pt;color:#6b5560;margin-top:2mm}
.doc-body{flex:1}
.pg{width:100%;border-collapse:collapse;flex:1}
.pg>thead>tr>td,.pg>tfoot>tr>td,.pg>tbody>tr>td{padding:0;border:0;vertical-align:top}
.pg-top,.pg-bot{height:0}
.doc-body h2{font-size:11pt;margin:4.5mm 0 2mm;display:flex;align-items:center;gap:2.5mm}
.doc-body h2::before{content:"";width:2.2mm;height:2.2mm;background:var(--doc-rose);border-radius:.4mm}
.doc-body p{margin:0 0 3mm;text-align:justify}
.doc-body ol,.doc-body ul{margin:0 0 3mm;padding-inline-start:6mm}
.doc-body li{margin-bottom:1.2mm}
.dt{width:100%;border-collapse:collapse;font-size:9pt;margin:1mm 0 4mm}
.dt th{background:var(--doc-petal);color:var(--doc-ink);font-weight:700;border:.25mm solid var(--doc-line);padding:1.4mm 2mm;text-align:start}
.dt td{border:.25mm solid var(--doc-line);padding:1.2mm 2mm;vertical-align:top}
.dt td.n,.dt th.n{text-align:center;font-family:"Sora","Bahij Janna",sans-serif;white-space:nowrap}
.dt tfoot td{font-weight:700;background:#fbf3f6}
.dt thead{display:table-header-group}
.dt tr{break-inside:avoid}
.dkv{display:grid;grid-template-columns:repeat(4,1fr);border:.25mm solid var(--doc-line);border-radius:1.5mm;overflow:hidden;margin:1mm 0 4mm}
.dkv>div{padding:1.6mm 3mm;border-inline-end:.25mm solid var(--doc-line);border-bottom:.25mm solid var(--doc-line)}
.dkv small{display:block;font-size:7.5pt;color:#7a6470}
.dkv b{font-size:10pt;font-family:"Sora","Bahij Janna",sans-serif;font-weight:600}
.dkv.c2{grid-template-columns:repeat(2,1fr)}.dkv.c3{grid-template-columns:repeat(3,1fr)}
.dkv b.t{font-family:inherit;font-weight:700}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;margin-top:6mm;break-inside:avoid}
.sig>div{border-top:.3mm solid var(--doc-line);padding-top:1.6mm;font-size:9pt;min-height:17mm;line-height:1.55}
.sig small{display:block;color:#7a6470}
.sig b{display:block;margin-top:1mm}
.sig .stamp{display:grid;place-items:center;border-top:0}
.sig .stamp i{width:21mm;height:21mm;border:.4mm dashed #d9b3c4;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:8pt;color:#b98aa0}
.doc-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:6mm;margin-top:5mm;padding-top:2.5mm;break-inside:avoid;border-top:.25mm solid var(--doc-line);font-size:8pt;color:#6b5560}
.doc-foot .qr{width:16mm;height:16mm;flex:none}
.doc-foot .qr svg{width:100%;height:100%}
.doc-foot .df-txt{display:flex;flex-direction:column;gap:.5mm}
.doc-foot .df-pw{font-size:7.5pt;color:#a08a95}
.cert{border:1.2mm solid var(--doc-rose);outline:.4mm solid var(--doc-line);outline-offset:-4mm;padding:16mm 18mm;min-height:268mm;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4mm}
.cert h1{font-size:26pt;color:var(--doc-rose);letter-spacing:.02em}
.cert .who{font-size:22pt;font-weight:700;border-bottom:.4mm solid var(--doc-line);padding:0 10mm 2mm}

/* print */
#print-root{display:none}
.paper .wm{inset:0 0 auto 0;height:297mm}
@page{size:A4;margin:11mm 0 13mm;@bottom-center{content:counter(page) " / " counter(pages);font:600 8pt Sora,sans-serif;color:#a08a95}}
@media print{
  html,body{background:#fff!important;margin:0!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  #print-root .paper{box-shadow:none;margin:0;width:210mm;min-height:268mm;padding:0 14mm;break-after:page;overflow:visible}
  #print-root .paper:last-child{break-after:auto}
  #print-root .paper .wm{position:fixed;inset:0;height:auto}
  #print-root .paper:not(:has(.cert)){display:block;min-height:0}
  #print-root .pg-bot{height:25mm}
  #print-root .doc-foot{position:fixed;bottom:0;left:14mm;right:14mm;margin:0;background:#fff}
  #print-root .cert{min-height:262mm}
}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .flow a:nth-child(3){border-inline-end:0}
  .flow a:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .flow a:nth-child(3)::after{display:none}
  .kanban{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1023px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .only-mobile{display:inline-grid!important}
  .only-desk{display:none!important}
  .topbar{padding:10px 16px}
  .topbar h1{font-size:18px}
  .topbar .tb-sub{display:none}
  .view{padding:6px 16px 108px}
  .tabbar{position:fixed;bottom:0;inset-inline:0;z-index:var(--z-nav);display:flex;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:color-mix(in oklch,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;border-radius:12px;color:var(--ink-3);font-size:11.5px;font-weight:700;text-decoration:none;min-width:0}
  .tabbar .i{width:22px;height:22px}
  .tabbar [aria-current=page]{color:var(--rose)}
  .tabbar [aria-current=page] .i{stroke-width:2.1}
  .cols-2,.cols-3,.cols-8-4,.cols-7-5{grid-template-columns:1fr}
  .pub{grid-template-columns:1fr}
  .pub-hero{min-height:auto;padding:24px 20px 36px;gap:28px}
  .hero-copy h1{font-size:32px}
  .hero-copy p{font-size:16px}
  .pub-side{padding:28px 20px 40px}
  .pub-side .ps-top{position:static;margin-bottom:12px}
  .ov.drawer{place-items:end stretch;justify-items:stretch}
  .drawer-panel,.drawer-panel.wide{width:100%;height:auto;max-height:92dvh;border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translateY(100%)!important}
  .ov.open .drawer-panel{transform:none!important}
  .ov.closing .drawer-panel{transform:translateY(100%)!important}
  .grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--line-2);margin:10px auto 0}
  .ov{padding:12px}
  .modal{max-height:92dvh;border-radius:var(--r-lg)}
  .doc-stage{padding:10px;max-height:62dvh}
}
@media (max-width:760px){
  .page-head h2{font-size:22px}
  .greet h2{font-size:23px}
  .form-grid,.form-grid.cols-3{grid-template-columns:1fr}
  .cols-4{grid-template-columns:1fr 1fr}
  .flow{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .flow::-webkit-scrollbar{display:none}
  .flow a{flex:0 0 42%;scroll-snap-align:start;border-bottom:0!important;border-inline-end:1px solid var(--line)!important}
  .flow a::after{display:block!important}
  .flow a:last-child::after{display:none!important}
  .flow .fl-n{font-size:28px}
  .kanban{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
  .kcol{flex:0 0 84%;scroll-snap-align:start}
  .kv{grid-template-columns:1fr 1fr}
  .tbl.stackable thead{display:none}
  .tbl.stackable,.tbl.stackable tbody,.tbl.stackable tr,.tbl.stackable td{display:block;width:100%}
  .tbl.stackable tr{padding:12px 16px;border-bottom:1px solid var(--line)}
  .tbl.stackable td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:end}
  .tbl.stackable td::before{content:attr(data-l);font-size:12.5px;color:var(--ink-3);font-weight:700;text-align:start;flex:none}
  .tbl.stackable td.num{text-align:end}
  .tbl.stackable td[data-l=""]::before{display:none}
  .tbl.stackable .actions{justify-content:flex-start}
  .tbl.stackable tfoot{display:block}
  .prj{grid-template-columns:auto minmax(0,1fr);padding:16px}
  .prj>:last-child{grid-column:1/-1}
  .hbar{grid-template-columns:96px 1fr auto}
  .panel-head,.panel-body,.li,.alert-row{padding-inline:16px}
  .search-trigger{display:none}
  .pin input{width:50px;height:54px}
  .client-body{margin-top:-96px}
  .g-row,.g-scale{--g-label:118px}
  .stat-line{grid-template-columns:1fr 1fr}
  .stat-line>div:last-child:nth-child(odd){grid-column:1/-1}
  .pub-hero{padding:18px 18px 26px;gap:18px}
  .pub-hero .hero-copy p,.pub-hero .hero-foot{display:none}
  .hero-copy h1{font-size:27px}
  .lockup .brand-mark{width:44px;height:44px}.lockup .brand-word{height:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .modal,.drawer-panel,.toast,.pop{transition-property:opacity!important;transform:none!important}
  .btn:active,.icon-btn:active,.tile:active{transform:none}
}

function daysPhrase(n, lang = S.lang) {
  n = Math.abs(Number(n) || 0);
  if (lang !== 'ar') return `${n} ${n === 1 ? 'day' : 'days'}`;
  if (n === 0) return 'أقل من يوم'; if (n === 1) return 'يوم واحد'; if (n === 2) return 'يومين';
  if (n <= 10) return `${n} أيام`; return `${n} يومًا`;
}
function t(k, vars) {
  if (vars && vars.d != null && vars.dd == null) vars = { ...vars, dd: daysPhrase(vars.d) };
  let s = I18N[S.lang]?.[k] ?? I18N.en[k] ?? I18N.ar[k] ?? k;
  if (vars) s = s.replace(/\{(\w+)\}/g, (_, v) => (vars[v] ?? ''));
  return s;
}

/* ===== 05 · UI kit: overlays, toasts, confirm, popover, palette, small components ===== */
const OV = { stack: [] };

  ov.innerHTML = `<div class="ov-scrim" data-close></div><div class="${panelCls}" tabindex="-1">${kind === 'drawer' ? '<div class="grab" aria-hidden="true"></div>' : ''}
    <div class="m-head"><div class="grow"><h3 id="${tid}">${title}</h3>${sub ? `<p>${sub}</p>` : ''}</div><button type="button" class="icon-btn" data-close aria-label="${t('c.close')}">${icon('x')}</button></div>
    <div class="m-body">${body}</div>${foot ? `<div class="m-foot">${foot}</div>` : ''}</div>`;
  root.appendChild(ov);
  const prevFocus = document.activeElement;
  const api = { el: ov, panel: ov.querySelector('.modal,.drawer-panel'), close, closed: false, setBody(h) { ov.querySelector('.m-body').innerHTML = h; }, setFoot(h) { const f = ov.querySelector('.m-foot'); if (f) f.innerHTML = h; } };
  ov.addEventListener('click', (e) => { const c = e.target.closest('[data-close]'); if (c && ov.contains(c)) { e.preventDefault(); close(); } });
  requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('open')));
  OV.stack.push(api);
  document.documentElement.style.overflow = 'hidden';
  setTimeout(() => {
    if (api.closed) return;

    const first = window.matchMedia('(pointer:fine)').matches ? ov.querySelector('.m-body input:not([type=hidden]):not([type=file]):not([type=checkbox]):not([type=radio]), .m-body select, .m-body textarea') : null;
    (af || first || api.panel).focus({ preventScroll: true });
  }, 80);

  function close(result) {

    if (!OV.stack.length) document.documentElement.style.overflow = '';
    setTimeout(() => ov.remove(), 300);
    if (onClose) onClose(result);
    if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
  }
  if (onMount) onMount(api);
  return api;
}
const openModal = (o) => openOverlay({ ...o, kind: 'modal' });
const openDrawer = (o) => openOverlay({ ...o, kind: 'drawer' });
function closeTop() { const top = OV.stack[OV.stack.length - 1]; if (top) top.close(); }
function closeAll() { [...OV.stack].forEach((o) => o.close()); }

/* bottom-sheet drag to dismiss (mobile) */
function swipeToClose(api) {
  const panel = api.panel; const handle = panel.querySelector('.grab'); const head = panel.querySelector('.m-head');
  let y0 = null, dy = 0;
  const start = (e) => { if (window.innerWidth > 1023) return; y0 = e.touches ? e.touches[0].clientY : e.clientY; dy = 0; panel.style.transition = 'none'; };
  const move = (e) => { if (y0 == null) return; dy = Math.max(0, (e.touches ? e.touches[0].clientY : e.clientY) - y0); panel.style.transform = `translateY(${dy}px)`; };
  const end = () => { if (y0 == null) return; panel.style.transition = ''; panel.style.transform = ''; if (dy > 90) api.close(); y0 = null; };
  [handle, head].forEach((el) => { if (!el) return; el.addEventListener('touchstart', start, { passive: true }); el.addEventListener('touchmove', move, { passive: true }); el.addEventListener('touchend', end); });
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('.pop.open')) { closePop(); return; } if (OV.stack.length) { e.preventDefault(); closeTop(); } }
  if (e.key === 'Tab' && OV.stack.length) {
    const p = OV.stack[OV.stack.length - 1].panel;
    const f = $$('a[href],button:not([disabled]),input:not([type=hidden]):not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', p).filter((x) => x.offsetParent !== null);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && me() && me().role !== 'worker') { e.preventDefault(); openPalette(); }
});

function toast(msg, type = 'ok', opt = {}) {
  const root = $('#toast-root'); if (!root) return;

  root.appendChild(el);

  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 220); };
  if (opt.action) el.querySelector('.t-act').addEventListener('click', () => { opt.action.fn(); kill(); });

/* popover anchored to a trigger (origin-aware scale, per Emil) */
let popEl = null;
function openPop(trigger, html) {
  closePop();
  popEl = document.createElement('div'); popEl.className = 'pop'; popEl.innerHTML = html; document.body.appendChild(popEl);
  const r = trigger.getBoundingClientRect(); const w = popEl.offsetWidth;
  let left = isRTL() ? r.left : r.right - w; left = clamp(left, 12, window.innerWidth - w - 12);
  popEl.style.top = r.bottom + 8 + 'px'; popEl.style.left = left + 'px';
  popEl.style.transformOrigin = `${clamp(r.left + r.width / 2 - left, 0, w)}px 0`;
  requestAnimationFrame(() => popEl && popEl.classList.add('open'));
  setTimeout(() => document.addEventListener('click', outsidePop), 0);
}
function outsidePop(e) { if (popEl && !popEl.contains(e.target)) closePop(); }

}

    const host = tb.getBoundingClientRect(); const a = act.getBoundingClientRect();
    const x = a.left - host.left + tb.scrollLeft; const w = a.width;

    ind.style.insetInlineStart = '0'; ind.style.left = '0'; ind.style.right = 'auto';

function entityDrawer(kind, id, build, size = '') {

  const first = build(); if (!first) { drawerClosed(); return; }

/* ===== 07 · charts (hand-built SVG, measured at real pixel size) ===== */
function barChart(host, data, { height = 210, fmtTip = (d) => `${d.label}: ${d.v}`, highlight = -1 } = {}) {
  if (!host) return;
  const W = Math.max(260, host.clientWidth); const H = height;
  const rtl = isRTL();
  const m = { t: 14, b: 26, s: 30, e: 6 }; // s = side of y-axis labels
  const iw = W - m.s - m.e, ih = H - m.t - m.b;
  const max = Math.max(4, ...data.map((d) => d.v));
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 20 ? 5 : Math.ceil(max / 4 / 5) * 5;
  const top = Math.ceil(max / step) * step;
  const n = data.length, band = iw / n, bw = Math.min(24, band * 0.62);
  const xAt = (i) => { const pos = m.s + band * i + band / 2; return rtl ? W - pos : pos; };
  const yAt = (v) => m.t + ih - (v / top) * ih;
  const axisX = rtl ? W - m.s + 8 : m.s - 8;
  let g = '';
  for (let v = 0; v <= top; v += step) { const y = yAt(v).toFixed(1); g += `<line x1="${rtl ? m.e : m.s}" x2="${rtl ? W - m.s : W - m.e}" y1="${y}" y2="${y}"/>`; }
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(`<text x="${axisX}" y="${(yAt(v) + 4).toFixed(1)}" text-anchor="${rtl ? 'start' : 'end'}">${v}</text>`);
  const labelEvery = band < 30 ? 2 : 1;
  const bars = data.map((d, i) => {
    const x = xAt(i) - bw / 2, y = yAt(d.v), h = m.t + ih - y, r = Math.min(4, h);
    const path = d.v > 0 ? `M${x.toFixed(1)} ${(m.t + ih).toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)}H${(x + bw - r).toFixed(1)}Q${(x + bw).toFixed(1)} ${y.toFixed(1)} ${(x + bw).toFixed(1)} ${(y + r).toFixed(1)}V${(m.t + ih).toFixed(1)}Z` : '';
    const lbl = i % labelEvery === (n - 1) % labelEvery ? `<text x="${xAt(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(d.short)}</text>` : '';
    return `<g data-i="${i}">${path ? `<path class="bar ${i === highlight ? 'today' : ''}" d="${path}"/>` : ''}<rect class="hit" x="${(xAt(i) - band / 2).toFixed(1)}" y="${m.t}" width="${band.toFixed(1)}" height="${ih}"/>${lbl}</g>`;
  }).join('');
  host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(host.dataset.label || '')}"><g class="grid">${g}</g><g class="axis">${ticks.join('')}</g><g class="axis">${bars}</g></svg><div class="tip" role="tooltip"></div>
    <table class="sr-only"><tbody>${data.map((d) => `<tr><th>${esc(d.label)}</th><td>${d.v}</td></tr>`).join('')}</tbody></table>`;
  const tip = $('.tip', host); const svg = $('svg', host);
  const show = (gEl) => {
    const i = +gEl.dataset.i; const d = data[i]; $$('.bar', svg).forEach((b) => b.classList.remove('on')); $('.bar', gEl)?.classList.add('on');
    tip.innerHTML = fmtTip(d); tip.style.left = xAt(i) + 'px'; tip.style.top = Math.max(18, yAt(d.v)) + 'px'; tip.classList.add('on');
  };
  svg.addEventListener('pointermove', (e) => { const gEl = e.target.closest('g[data-i]'); if (gEl) show(gEl); });
  svg.addEventListener('pointerleave', () => { tip.classList.remove('on'); $$('.bar', svg).forEach((b) => b.classList.remove('on')); });
}
function hbars(rows) {

  return `<div class="hbars">${rows.map((r) => `<div class="hbar"><span class="ellipsis">${esc(r.label)}</span>${meter((r.v / max) * 100)}<span class="v">${r.v}</span></div>`).join('')}</div>`;

/* ===== 08 · soap-film shader (scroll + pointer driven), WebGL1 with CSS fallback ===== */
const SHADER = (() => {
  const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}';
  const FS = `precision mediump float;
uniform vec2 u_res;uniform float u_time;uniform float u_scroll;uniform vec2 u_mouse;uniform float u_dark;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);}

vec3 filmD(float t){return vec3(0.40,0.18,0.30)+vec3(0.10,0.07,0.10)*cos(6.28318*(t+vec3(0.0,0.18,0.36)));}
void main(){

  vec2 m=u_mouse*vec2(asp,1.0);

  vec2 r=vec2(fbm(p*1.7+2.2*q+vec2(1.7,9.2)+u_scroll*0.9),fbm(p*1.7+2.2*q+vec2(8.3,2.8)-u_scroll*0.6));
  float d=distance(p,m);float sw=exp(-d*d*6.0);
  float th=fbm(p*1.2+2.4*r+sw*0.6)+u_scroll*0.35;
  vec3 irid=mix(film(th*1.35+0.15),filmD(th*1.35+0.15),u_dark);
  vec3 blush=mix(vec3(1.0,0.955,0.972),vec3(0.11,0.055,0.08),u_dark);
  vec3 rose=mix(vec3(0.97,0.62,0.76),vec3(0.50,0.17,0.32),u_dark);
  vec3 col=mix(blush,rose,smoothstep(0.30,0.95,th)*0.62);

/* ===== 14 · training academy: courses, player, quiz, matrix, certificates ===== */
const playerHref = (cid, step) => (me()?.role === 'worker' ? `#/w?tab=training&course=${cid}&step=${step}` : `#/course/${cid}?step=${step}`);
function ensureEnroll(sid, cid) { let e = enrollment(sid, cid); if (!e) { e = { staffId: sid, courseId: cid, status: 'progress', lesson: 0 }; db.enrollments.push(e); } return e; }
function courseState(sid, c) {
  const e = enrollment(sid, c.id);
  if (!e) return { key: 'none', pct: 0, e };
  if (e.status === 'passed') return { key: 'passed', pct: 100, e };
  const pct = Math.round((Math.min(e.lesson ?? 0, c.lessons.length) / (c.lessons.length + 1)) * 100);
  return { key: 'progress', pct: Math.max(8, pct), e };
}
function courseCardLearner(c, sid) {
  const st = courseState(sid, c);
  const cta = st.key === 'passed' ? t('tr.review') : st.key === 'progress' ? t('tr.continue') : t('tr.start');
  const step = st.key === 'progress' ? Math.min(st.e.lesson || 0, c.lessons.length) : 0;
  return `<a class="course" href="${playerHref(c.id, step)}" style="text-decoration:none">
    <div class="c-top">${ring(st.pct, 54, { label: false, tone: st.key === 'passed' ? 'ok' : '' })}<div class="grow"><h4>${esc(L(c.title))}</h4><div class="c-meta mt-8"><span class="chip ${c.mandatory ? 'chip-rose' : 'chip-line'}">${c.mandatory ? t('tr.mandatory') : t('tr.optional')}</span><span class="chip chip-line">${t('tr.lessons', { n: c.lessons.length })}</span><span class="chip chip-line">${t('tr.minutes', { n: c.minutes })}</span></div></div></div>
    <p class="muted small">${esc(L(c.desc))}</p>
    <div class="row between"><span class="small b">${st.key === 'passed' ? `${icon('badge-check', 'i-sm')} ${t('tr.passed')} · <span class="num">${st.e.score}%</span>` : st.key === 'progress' ? t('tr.inProgress') : t('tr.notStarted')}</span><span class="btn btn-sm ${st.key === 'passed' ? 'btn-ghost' : 'btn-soft'}">${cta}</span></div></a>`;
}
function learnerHome(sid) {
  const tr = trainingOf(sid);
  return `<div class="panel panel-pad row" style="gap:18px;flex-wrap:wrap;margin-bottom:18px">${ring(tr.mandTotal ? (tr.mandPassed / tr.mandTotal) * 100 : 0, 72)}<div class="grow"><h3 style="font-size:18px">${t('tr.progress', { a: tr.mandPassed, b: tr.mandTotal })}</h3><p class="muted small mt-8">${t('tr.contentLang')}</p></div><span class="chip ${tr.certified ? 'chip-ok' : 'chip-warn'}" style="height:30px;font-size:13.5px">${icon(tr.certified ? 'badge-check' : 'graduation-cap', 'i-sm')}${tr.certified ? t('tr.certified') : t('tr.trainee')}</span></div>
    <div class="course-grid">${[...db.courses].sort((a, b) => Number(b.mandatory) - Number(a.mandatory)).map((c) => courseCardLearner(c, sid)).join('')}</div>`;
}

/* player */
function playerHTML(sid, c, step) {
  const n = c.lessons.length; step = clamp(Number(step) || 0, 0, n + 1);
  const back = me()?.role === 'worker' ? '#/w?tab=training' : '#/training';
  const dots = `<div class="dots" aria-hidden="true">${c.lessons.map((_, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}<i class="${step >= n ? 'on' : ''}"></i></div>`;
  const head = `<div class="row between" style="margin:4px 0 16px"><a class="btn btn-ghost btn-sm" href="${back}">${icon(isRTL() ? 'chevron-right' : 'chevron-left', 'i-sm')}${t('c.back')}</a>${dots}</div><h2 style="font-size:22px;margin-bottom:4px">${esc(L(c.title))}</h2>`;
  if (step < n) {
    const ls = c.lessons[step]; const e = ensureEnroll(sid, c.id); if (e.status !== 'passed') { e.lesson = Math.max(e.lesson || 0, step); saveDB(); }
    return `${head}<p class="muted small" style="margin-bottom:14px">${t('tr.lessonN', { i: step + 1, n })}</p>
      <article class="lesson"><h3>${esc(L(ls.title))}</h3><p>${esc(L(ls.body))}</p>${ls.points?.length ? `<ul>${ls.points.map((p) => `<li>${esc(L(p))}</li>`).join('')}</ul>` : ''}</article>
      <div class="row between mt-16">${step > 0 ? `<a class="btn" href="${playerHref(c.id, step - 1)}">${t('c.prev')}</a>` : '<span></span>'}<a class="btn btn-primary btn-lg" href="${playerHref(c.id, step + 1)}">${step === n - 1 ? t('tr.toQuiz') : t('c.next')}</a></div>`;
  }
  if (step === n) {
    const ans = (S.ui.quiz && S.ui.quiz.c === c.id) ? S.ui.quiz.a : {};
    S.ui.quiz = { c: c.id, a: ans };
    const e = ensureEnroll(sid, c.id); if (e.status !== 'passed') { e.lesson = n; saveDB(); }
    return `${head}<p class="muted small" style="margin-bottom:14px">${t('tr.quiz')} · ${t('tr.questions', { n: c.quiz.length })} · ${t('tr.passMark', { n: c.passMark })}</p>
      <form data-form="quiz" data-c="${c.id}" class="stack" style="gap:18px">${c.quiz.map((q, qi) => `<fieldset class="lesson" style="padding:18px"><legend class="sr-only">${qi + 1}</legend><h3 style="font-size:17px;margin-bottom:12px"><span class="num muted">${qi + 1}.</span> ${esc(L(q.q))}</h3><div class="stack" style="gap:8px">${q.opts.map((o, oi) => `<button type="button" class="quiz-opt" data-act="quiz-pick" data-q="${qi}" data-o="${oi}" aria-pressed="${ans[qi] === oi}"><span class="qk">${'أبجد'[oi] && isRTL() ? 'أبجد'[oi] : 'ABCD'[oi]}</span>${esc(L(o))}</button>`).join('')}</div></fieldset>`).join('')}
      <div class="row between"><a class="btn" href="${playerHref(c.id, n - 1)}">${t('c.prev')}</a><button class="btn btn-primary btn-lg" type="submit">${t('tr.submit')}</button></div></form>`;
  }
  const e = enrollment(sid, c.id); const score = S.ui.lastScore?.c === c.id ? S.ui.lastScore.s : e?.score ?? e?.lastScore ?? 0; const ok = score >= c.passMark;
  return `${head}<div class="panel panel-pad mt-16" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 20px">${ring(score, 120, { tone: ok ? 'ok' : 'warn' })}<h3 style="font-size:22px">${ok ? t('tr.congrats') : t('tr.failed')}</h3><p class="muted">${ok ? t('tr.yourScore', { n: score }) : t('tr.needMore', { n: c.passMark })}</p>
    <div class="row-wrap" style="justify-content:center">${ok && e?.certNo ? `<button class="btn btn-primary" data-act="doc-cert" data-s="${sid}" data-c="${c.id}">${icon('award', 'i-sm')}${t('tr.printCert')}</button>` : `<a class="btn btn-primary" href="${playerHref(c.id, 0)}" data-act="quiz-reset" data-c="${c.id}">${icon('rotate-ccw', 'i-sm')}${t('tr.retry')}</a>`}<a class="btn" href="${back}">${t('c.back')}</a></div></div>`;
}
ACT['quiz-pick'] = (el) => { const q = +el.dataset.q, o = +el.dataset.o; S.ui.quiz.a[q] = o; $$(`.quiz-opt[data-q="${q}"]`).forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.o === o))); };

FORMS.quiz = (f) => {
  const c = courseById(f.dataset.c); const ans = S.ui.quiz?.a || {};
  if (Object.keys(ans).length < c.quiz.length) { toast(t('tr.answerAll'), 'err'); return; }
  const right = c.quiz.filter((q, i) => ans[i] === q.a).length; const score = Math.round((right / c.quiz.length) * 100);

  if (score >= c.passMark && e.status !== 'passed') { e.status = 'passed'; e.score = score; e.passedAt = isoDate(); e.certNo = nextNo('cert'); }

  S.ui.lastScore = { c: c.id, s: score }; S.ui.quiz = null; saveDB();

};

/* ===== 15 · contracts, tenders (contracting) and clients ===== */
const CT_TYPES = ['annual', 'monthly', 'project', 'once'];
const PAY_TERMS = ['monthly', 'quarterly', 'upfront', 'milestones'];
const TD_STAGES = ['study', 'submitted', 'awarded', 'lost'];
const TD_TONE = { study: 'new', submitted: 'supervisor', awarded: 'done', lost: 'cancelled' };
const CT_TONE = { active: 'chip-ok', expiring: 'chip-warn', ended: 'chip-line', draft: 'chip-info', suspended: 'chip-bad' };
const tenderValue = (x) => Math.round(sum(x.items || [], (i) => (Number(i.q) || 0) * (Number(i.p) || 0)) * (Number(x.months) || 1));
function buildPayments(c) {
  const total = contractTotal(c); const months = Math.max(1, Math.round(daysBetween(c.start, c.end) / 30.4));
  const n = c.payTerms === 'monthly' ? months : c.payTerms === 'quarterly' ? Math.max(1, Math.ceil(months / 3)) : c.payTerms === 'milestones' ? 3 : 1;
  const stepM = c.payTerms === 'monthly' ? 1 : c.payTerms === 'quarterly' ? 3 : Math.max(1, Math.floor(months / n));
  return Array.from({ length: n }, (_, i) => { const d = new Date(c.start); d.setMonth(d.getMonth() + i * stepM); return { due: isoDate(d), amount: Math.round((total / n) * 100) / 100, paid: false }; });
}
function ctRemain(c) {
  const st = contractState(c); const today = new Date(); const span = Math.max(1, daysBetween(c.start, c.end)); const done = clamp((daysBetween(c.start, today) / span) * 100, 0, 100);
  const left = daysBetween(today, c.end);
  const label = st === 'ended' ? t('ct.ended', { d: -left }) : new Date(c.start) > today ? t('ct.starts', { d: daysBetween(today, c.start) }) : t('ct.left', { d: left });
  return { pct: done, label, tone: st === 'expiring' ? 'warn' : st === 'ended' ? '' : '' };
}

  upholstery: ['شفط السجاد والكنب', 'معالجة البقع', 'الغسيل بالبخار والتجفيف'],

const FORM_DOCS = {
  letter(no, o) {
    const body = `<p style="margin-top:4mm"><b>${esc(o.to || 'السادة/ ........................ المحترمين')}</b></p><p>السلام عليكم ورحمة الله وبركاته، وبعد:</p><p><b>الموضوع: ${esc(o.subject || '')}</b></p>${String(o.body || '').split(/\n{2,}/).map((p) => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('')}<p>وتفضلوا بقبول فائق الاحترام والتقدير،،،</p>`;
    return paper({ no, title: 'خطاب رسمي', body, meta: o.attach ? [['المرفقات', o.attach]] : [], sigs: [{ label: o.signTitle || db.settings.signatoryTitle, name: o.signName || db.settings.signatory, title: '' }, { stamp: true }] });
  },
  workOrder(no, o) {
    const r = reqById(o.req); if (!r) return '';
    const sup = staffById(r.supervisorId), wk = staffById(r.workerId);
    const body = `${dkv([['رقم الطلب', r.id], ['نوع الخدمة', arSvc(r.service), 1], ['الموعد', `${AD.short(r.prefDate)} · ${arPer(r.period).split('·')[0]}`, 1], ['الأولوية', r.priority === 'urgent' ? 'عاجل' : 'عادي', 1]])}
      <h2>بيانات العميل والموقع</h2>${dkv([['العميل', esc(r.clientName), 1], ['الجوال', esc(r.clientPhone)], ['الحي', esc(r.district || '—'), 1], ['الدور / الشقة', esc([r.floor, r.apartment].filter(Boolean).join(' / ') || '—'), 1]])}
      ${r.gps ? `<p style="font-size:8.5pt;color:#6b5560;direction:ltr;text-align:left">${esc(r.gps)}</p>` : ''}
      <h2>الفريق المكلّف</h2>${dkv([['المشرفة', esc(sup?.name || '—'), 1], ['العاملة', esc(wk?.name || '—'), 1], ['عدد العاملات', r.workers], ['الساعات المقدّرة', r.hoursEst]])}
      <h2>نطاق العمل</h2><ol>${(SVC_SCOPE[r.service] || []).map((x) => `<li>${esc(x)} ☐</li>`).join('')}</ol>${r.notes ? `<p><b>ملاحظات العميل:</b> ${esc(r.notes)}</p>` : ''}
      <h2>تعليمات السلامة</h2><ul style="columns:2;column-gap:8mm"><li>عدم خلط المبيّض (الكلور) مع الأمونيا أو المنظفات الحمضية.</li><li>ارتداء القفازات، والكمامة والنظارة عند الرش.</li><li>وضع لافتة «أرضية مبللة» قبل المسح.</li><li>تصوير المكان المنظَّف فقط دون أشخاص، ورفع الصورة في النظام عند الإنهاء.</li></ul>`;
    return paper({ no, title: 'أمر عمل ميداني', subtitle: `${arSvc(r.service)} · ${r.clientName}`, body, sigs: [{ label: 'المشرفة', name: sup?.name, title: 'مشرفة ميدانية' }, { label: 'العاملة', name: wk?.name, title: 'عاملة نظافة' }, { label: 'العميل (عند الوصول)', name: r.clientName, title: '' }] });
  },
  handover(no, o) {
    const r = reqById(o.req); if (!r) return '';
    const d = r.approvedAt || r.finishedAt || new Date().toISOString();
    const body = `<p>إنه في يوم ${AD.day(d)} ${AD.date(d)}، الموافق ${AD.hijri(d)}، تم بحمد الله تسليم الأعمال الموضحة أدناه إلى العميل، بعد تنفيذها من فريق ${esc(db.settings.companyAr)} ومطابقتها للمطلوب.</p>
      ${dkv([['رقم الطلب', r.id], ['نوع الخدمة', arSvc(r.service), 1], ['العميل', esc(r.clientName), 1], ['الموقع', esc([r.district, r.floor, r.apartment].filter(Boolean).join('، ')), 1], ['بدء العمل', r.startedAt ? `${AD.short(r.startedAt)} ${FMT.time(r.startedAt)}` : '—'], ['انتهاء العمل', r.finishedAt ? `${AD.short(r.finishedAt)} ${FMT.time(r.finishedAt)}` : '—'], ['عدد الساعات', r.hours || REQ.suggestHours(r)], ['المشرفة', esc(staffById(r.supervisorId)?.name || '—'), 1]])}
