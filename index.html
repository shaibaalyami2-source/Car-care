/* ===== 22 · signatures, company stamp and the personal profile ===== */
/* signature pad: pointer input, smoothed strokes, pressure-like width from speed, trimmed transparent PNG */
function sigPad(host, { height = 190, ink = '#1d2c5c' } = {}) {
  host.innerHTML = `<div class="sig-pad"><canvas aria-label="${esc(t('sg.padLabel'))}" role="img"></canvas><span class="sig-base" aria-hidden="true"></span><span class="sig-hint">${t('sg.hint')}</span></div>`;
  const wrap = $('.sig-pad', host), cv = $('canvas', host), ctx = cv.getContext('2d');
  let dpr = 1, strokes = 0, drawing = false, last = null, lastW = 2.4, lastT = 0;
  const size = () => { dpr = Math.max(1, window.devicePixelRatio || 1); const w = wrap.clientWidth || 520; const img = strokes ? cv.toDataURL() : null; cv.width = Math.round(w * dpr); cv.height = Math.round(height * dpr); cv.style.height = height + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ink; ctx.fillStyle = ink; if (img) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, w, height); im.src = img; } };
  const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() }; };
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; last = pos(e); lastT = last.t; lastW = 2.6; ctx.beginPath(); ctx.arc(last.x, last.y, 1.3, 0, Math.PI * 2); ctx.fill(); strokes++; wrap.classList.add('has-ink'); });
  cv.addEventListener('pointermove', (e) => {
    if (!drawing) return; const p = pos(e); const d = Math.hypot(p.x - last.x, p.y - last.y); if (d < 1.2) return;
    const v = d / Math.max(1, p.t - lastT); const w = clamp(3.4 - v * 1.6, 1.2, 3.4); const nw = lastW * 0.6 + w * 0.4;
    const mx = (last.x + p.x) / 2, my = (last.y + p.y) / 2;
    ctx.lineWidth = nw; ctx.beginPath(); ctx.moveTo(last.mx ?? last.x, last.my ?? last.y); ctx.quadraticCurveTo(last.x, last.y, mx, my); ctx.stroke();
    last = { ...p, mx, my }; lastW = nw; lastT = p.t;
  });
  const end = () => { drawing = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
  cv.style.touchAction = 'none';
  size(); const ro = new ResizeObserver(() => size()); ro.observe(wrap);
  return {
    isEmpty: () => strokes === 0,
    clear() { strokes = 0; ctx.clearRect(0, 0, cv.width, cv.height); wrap.classList.remove('has-ink'); },
    toDataURL(maxW = 640) {
      if (!strokes) return null;
      const W = cv.width, H = cv.height; const px = ctx.getImageData(0, 0, W, H).data;
      let x0 = W, y0 = H, x1 = 0, y1 = 0;
      for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (px[(y * W + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 <= x0 || y1 <= y0) return null;
      const padPx = 10 * dpr; x0 = Math.max(0, x0 - padPx); y0 = Math.max(0, y0 - padPx); x1 = Math.min(W, x1 + padPx); y1 = Math.min(H, y1 + padPx);
      const sw = x1 - x0, sh = y1 - y0; const k = Math.min(1, maxW / sw);
      const out = document.createElement('canvas'); out.width = Math.round(sw * k); out.height = Math.round(sh * k);
      out.getContext('2d').drawImage(cv, x0, y0, sw, sh, 0, 0, out.width, out.height);
      return out.toDataURL('image/png');
    },
    destroy() { ro.disconnect(); },
  };
}
/* signature dialog shared by the profile and the client handover */
function openSigDialog({ title, sub = '', onSave }) {
  let pad = null;
  const m = openModal({ size: 'lg', title: esc(title), sub, body: `<div id="sig-host"></div><p class="small muted mt-8">${t('sg.tip')}</p>`,
    foot: `<button class="btn btn-ghost" data-act="sig-clear">${icon('eraser', 'i-sm')}${t('sg.clear')}</button><span class="grow"></span><button class="btn btn-ghost" data-close>${t('c.cancel')}</button><button class="btn btn-primary" data-sig-save>${icon('check', 'i-sm')}${t('sg.save')}</button>`,
    onClose: () => pad && pad.destroy() });
  requestAnimationFrame(() => { pad = sigPad($('#sig-host', m.el)); });
  m.el.addEventListener('click', (e) => { if (e.target.closest('[data-act=sig-clear]')) { e.preventDefault(); e.stopPropagation(); pad?.clear(); } });
  $('[data-sig-save]', m.el).addEventListener('click', () => { const d = pad?.toDataURL(); if (!d) { toast(t('sg.empty'), 'err'); return; } onSave(d); m.close(); });
  return m;
}

/* ---------- company stamp: designed here (SVG) or uploaded ---------- */
const STAMP_COLORS = { navy: '#1f3a8a', rose: '#b4235f', purple: '#5b3a8c', green: '#1f6e4f' };
function stampDefaults() { const st = db.settings; return { mode: 'design', top: st.companyAr, bottom: (st.companyEn || '').toUpperCase(), c1: 'الإدارة', c2: st.cr ? `س.ت ${st.cr}` : 'مكة المكرمة', color: 'navy', shape: 'circle', tilt: 1 }; }
function stampSVG(o0) {
  const o = { ...stampDefaults(), ...(o0 || {}) }; const c = STAMP_COLORS[o.color] || o.color || STAMP_COLORS.navy;
  const id = 'st' + Math.random().toString(36).slice(2, 7);
  const rot = o.tilt ? -6 : 0;
  if (o.shape === 'rect') {
    return `<svg viewBox="0 0 240 140" class="stamp-svg" role="img" aria-label="${esc(o.top)}"><g transform="rotate(${rot / 2} 120 70)" fill="none" stroke="${c}"><rect x="6" y="6" width="228" height="128" rx="12" stroke-width="4"/><rect x="14" y="14" width="212" height="112" rx="8" stroke-width="1.4"/></g>
      <g fill="${c}" font-family="'Bahij Janna','Readex Pro',sans-serif" text-anchor="middle" transform="rotate(${rot / 2} 120 70)"><text x="120" y="46" font-size="17" font-weight="700" direction="rtl">${esc(o.top)}</text><text x="120" y="74" font-size="15" direction="rtl">${esc(o.c1)}</text><text x="120" y="96" font-size="12" direction="rtl">${esc(o.c2)}</text><text x="120" y="118" font-size="10.5" font-family="Sora,sans-serif" letter-spacing="1">${esc(o.bottom)}</text></g></svg>`;
  }
  const fit = (s, max) => Math.max(10, Math.min(16, (max / Math.max(1, String(s).length)) * 1.9));
  return `<svg viewBox="0 0 200 200" class="stamp-svg" role="img" aria-label="${esc(o.top)}"><defs><path id="${id}t" d="M 30 100 A 70 70 0 0 1 170 100"/><path id="${id}b" d="M 34 100 A 66 66 0 0 0 166 100"/></defs>
    <g transform="rotate(${rot} 100 100)"><g fill="none" stroke="${c}"><circle cx="100" cy="100" r="95" stroke-width="4"/><circle cx="100" cy="100" r="86" stroke-width="1.3"/><circle cx="100" cy="100" r="54" stroke-width="1.3"/></g>
    <g fill="${c}" font-family="'Bahij Janna','Readex Pro',sans-serif"><text font-size="${fit(o.top, 140)}" font-weight="700" direction="rtl"><textPath href="#${id}t" startOffset="50%" text-anchor="middle">${esc(o.top)}</textPath></text>
    <text font-size="${Math.min(11, fit(o.bottom, 150))}" font-family="Sora,sans-serif" letter-spacing="1.2" dominant-baseline="hanging"><textPath href="#${id}b" startOffset="50%" text-anchor="middle">${esc(o.bottom)}</textPath></text>
    <text x="100" y="96" text-anchor="middle" font-size="17" font-weight="700" direction="rtl">${esc(o.c1)}</text><text x="100" y="118" text-anchor="middle" font-size="11.5" direction="rtl">${esc(o.c2)}</text>
    <path d="M24 100l3.2-2.3 3.2 2.3-3.2 2.3zM169.6 100l3.2-2.3 3.2 2.3-3.2 2.3z"/></g></g></svg>`;
}

    </form></div>`;

MAP.zoomDist = function (name) {
  if (!MAP.map) return;
  $$('.map-chips .mchip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.d === name)));

/* ---------- the client's tracking page: the cleaner on her way, like a delivery app ---------- */
function trackLiveHTML(r, live) {
  if (!r || r.status !== 'worker' || !r.onwayAt || r.arrivedAt) return r && r.status === 'worker' && r.arrivedAt ? `<div class="tk-live ok">${icon('map-pin-check')}<b>${t('tk.arrived')}</b></div>` : '';
  const w = staffById(r.workerId); const loc = live || (w ? locOf(w) : null); const dest = reqDest(r);
  const dist = loc && dest ? haversine(loc, dest) : null; const eta = dist != null ? Math.max(1, Math.round(dist / 1000 / ((loc && loc.spd) || 25) * 60)) : null;
  return `<div class="tk-live"><div class="row">${icon('navigation')}<div class="grow"><b>${t('tk.onway')}</b><small class="muted">${eta ? t('mp.eta', { m: eta, d: fmtDist(dist) }) : t('tk.onwayP')}</small></div></div>${loc && dest ? `<div class="tk-map" id="tk-map" data-lat="${loc.lat}" data-lng="${loc.lng}" data-dlat="${dest.lat}" data-dlng="${dest.lng}"></div>` : ''}</div>`;
}
function mountTrackMap() {
  const el = $('#tk-map'); if (!el || !loadLeaflet()) return;
  const a = [+el.dataset.lat, +el.dataset.lng], b = [+el.dataset.dlat, +el.dataset.dlng];
  const m = LF.map(el, { zoomControl: false, attributionControl: true, dragging: true, scrollWheelZoom: false });
  m.attributionControl.setPrefix(false);
  LF.tileLayer(CFG.tiles || db.settings.tileUrl || OSM_TILES, { maxZoom: 19, subdomains: 'abc', attribution: '© OpenStreetMap' }).addTo(m);
  LF.marker(a, { icon: LF.divIcon({ className: 'pin-wrap', html: `<div class="pin w-onway l-live"><span class="pin-pulse"></span><span class="pin-face"><span class="av av-pin h1">${icon('car', 'i-sm')}</span></span></div>`, iconSize: [46, 56], iconAnchor: [23, 54] }) }).addTo(m);
  LF.marker(b, { icon: LF.divIcon({ className: 'dest-wrap', html: `<div class="dest">${icon('house', 'i-sm')}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(m);
  LF.polyline([a, b], { color: '#d6487f', weight: 3, dashArray: '2 8', lineCap: 'round' }).addTo(m);
  m.fitBounds(LF.latLngBounds([a, b]).pad(0.35));
}

/* ---------- interactive guided tours: a spotlight on the real buttons ---------- */
const TOURS = {
  shell: [
    { sel: '.rail-toggle, .topbar .nav-toggle', k: 'menu' }, { sel: '.search-trigger, .tb-actions [data-act=palette]', k: 'search' }, { sel: '#sync-ind, #sync-line', k: 'sync' },
    { sel: '#chat-btn', k: 'chat' }, { sel: '#bell', k: 'bell' }, { sel: '[data-tour=help]', k: 'help' }, { sel: '.tb-me', k: 'profile' },
  ],
  requests: [{ sel: '[data-act="new-req"]', k: 'newReq' }, { sel: '.filters', k: 'filters' }, { sel: '.tbl-wrap, .cards', k: 'list' }, { sel: '[data-act="req-csv"]', k: 'csv' }],
  map: [{ sel: '.map-chips', k: 'areas' }, { sel: '#map-stats', k: 'stats' }, { sel: '#map-list', k: 'list' }, { sel: '.leaflet-marker-icon.pin-wrap', k: 'pin' }],
};
const TOUR = {
  id: null, i: 0, steps: [], el: null, navigating: false,
  start(id, route) {
    TOUR.stop(); const steps = TOURS[id]; if (!steps) return;
    TOUR.id = id; TOUR.steps = steps; TOUR.i = 0; closeAll(); NAV.close(false);
    const go = route || (id === 'shell' ? null : '#/' + (id === 'requests' ? 'requests' : id));
    if (go && location.hash !== go) { TOUR.navigating = true; location.hash = go; setTimeout(() => { TOUR.navigating = false; TOUR.show(); }, 650); } else setTimeout(TOUR.show, 120);
  },
  target() {
    const st = TOUR.steps[TOUR.i]; if (!st) return null;
    return $$(st.sel).find((e) => { const r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(e).visibility !== 'hidden'; }) || null;
  },
  show() {
    if (!TOUR.id) return;
    let tg = TOUR.target(); let guard = 0;
    while (!tg && TOUR.i < TOUR.steps.length - 1 && guard++ < 10) { TOUR.i++; tg = TOUR.target(); }
    if (!tg) { TOUR.stop(); return; }
    tg.scrollIntoView({ block: 'center', inline: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' });
    if (!TOUR.el) { TOUR.el = document.createElement('div'); TOUR.el.className = 'tour'; document.body.appendChild(TOUR.el); TOUR.el.addEventListener('click', TOUR.click); window.addEventListener('resize', TOUR.place); window.addEventListener('scroll', TOUR.place, { passive: true }); document.addEventListener('keydown', TOUR.key); }
    const st = TOUR.steps[TOUR.i]; const n = TOUR.steps.length;
    TOUR.el.innerHTML = `<div class="tour-spot"></div><div class="tour-card" role="dialog" aria-live="polite" aria-label="${esc(t('gd.tour'))}"><small class="eyebrow num">${TOUR.i + 1} / ${n}</small><b>${esc(t('tr.' + TOUR.id + '.' + st.k + '.t'))}</b><p>${esc(t('tr.' + TOUR.id + '.' + st.k + '.p'))}</p>
      <div class="tour-acts"><button class="btn btn-ghost btn-sm" data-t="stop">${t('gd.skip')}</button><span class="grow"></span>${TOUR.i ? `<button class="btn btn-sm" data-t="prev">${t('gd.prev')}</button>` : ''}<button class="btn btn-primary btn-sm" data-t="next">${TOUR.i === n - 1 ? t('gd.finish') : t('gd.next')}</button></div></div>`;
    TOUR.tg = tg; setTimeout(TOUR.place, reducedMotion() ? 0 : 280); TOUR.place();
    setTimeout(() => $('[data-t=next]', TOUR.el)?.focus({ preventScroll: true }), 300);
  },
  place() {
    if (!TOUR.el || !TOUR.tg) return; const r = TOUR.tg.getBoundingClientRect(); const pad = 6;
    const sp = $('.tour-spot', TOUR.el), cd = $('.tour-card', TOUR.el); if (!sp || !cd) return;
    Object.assign(sp.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
    const cw = Math.min(340, window.innerWidth - 24); cd.style.width = cw + 'px'; const ch = cd.offsetHeight;
    let top = r.bottom + 14; if (top + ch > window.innerHeight - 12) top = Math.max(12, r.top - ch - 14);
    let left = r.left + r.width / 2 - cw / 2; left = clamp(left, 12, window.innerWidth - cw - 12);
    Object.assign(cd.style, { top: top + 'px', left: left + 'px' });
  },
  click(e) { const b = e.target.closest('[data-t]'); if (!b) return; const a = b.dataset.t; if (a === 'stop') TOUR.stop(); else if (a === 'prev') { TOUR.i = Math.max(0, TOUR.i - 1); TOUR.show(); } else if (TOUR.i >= TOUR.steps.length - 1) { TOUR.stop(); toast(t('gd.tourDone')); } else { TOUR.i++; TOUR.show(); } },
  key(e) { if (!TOUR.id) return; if (e.key === 'Escape') TOUR.stop(); else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const fwd = (e.key === 'ArrowLeft') === isRTL(); $(`[data-t=${fwd ? 'next' : 'prev'}]`, TOUR.el)?.click(); } },
  stop() { TOUR.id = null; TOUR.tg = null; if (TOUR.el) { TOUR.el.remove(); TOUR.el = null; window.removeEventListener('resize', TOUR.place); window.removeEventListener('scroll', TOUR.place); document.removeEventListener('keydown', TOUR.key); } },
};

const PWA = {

  register() {

const APPS_SCRIPT_CODE = "/**\n * CRM · نظام إدارة خدمات النظافة — التخزين السحابي المبدئي على Google Sheet\n * ---------------------------------------------------------------------------\n * 1) من ملف Google Sheet: الإضافات (Extensions) ← Apps Script ← الصق هذا الملف بالكامل ← حفظ.\n * 2) اختر الدالة setup من الأعلى واضغط تشغيل (Run) ووافق على الأذونات. ستُنشأ الجداول ومفتاح الوصول في تبويب «إعداد».\n * 3) نشر (Deploy) ← نشر جديد ← تطبيق ويب (Web app) ← التنفيذ باسم: أنا ← من يمكنه الوصول: أي شخص (Anyone) ← نشر، وانسخ الرابط.\n * 4) في النظام: الإعدادات ← المزامنة السحابية ← الصق الرابط والمفتاح ← ربط.\n * عند تعديل هذا الكود لاحقًا: نشر ← إدارة عمليات النشر ← تعديل ← إصدار جديد (حتى يبقى الرابط نفسه).\n */\nvar TABLES = ['requests', 'clients', 'staff', 'contracts', 'tenders', 'projects', 'courses', 'enrollments', 'messages', 'docs', 'roles', 'payAdj', 'locations', 'chatRead', 'guide', 'settings'];\nvar TITLES = { requests: 'الطلبات', clients: 'العملاء', staff: 'الموظفات', contracts: 'العقود', tenders: 'المقاولات', projects: 'المشاريع', courses: 'الدورات', enrollments: 'التدريب', messages: 'المحادثات', docs: 'المستندات', roles: 'الأدوار والصلاحيات', payAdj: 'تعديلات الرواتب', locations: 'مواقع الميدان', chatRead: 'حالة القراءة', guide: 'تقدم الدروس', settings: 'الإعدادات' };\n/* readable columns so the office can read the sheet; the full record lives in the json columns */\nvar VIEW = {\n  requests: [['العميل', 'clientName'], ['الجوال', 'clientPhone'], ['الخدمة', 'service'], ['الحي', 'district'], ['الموعد', 'prefDate'], ['الحالة', 'status'], ['المشرفة', 'supervisorId'], ['العاملة', 'workerId']],\n  clients: [['الاسم', 'name'], ['الجوال', 'phone'], ['النوع', 'type'], ['العنوان', 'address']],\n  staff: [['الاسم', 'name'], ['الدور', 'role'], ['الجوال', 'phone'], ['اللغة', 'lang'], ['نشطة', 'active']],\n  contracts: [['العميل', 'clientId'], ['العنوان', 'title'], ['من', 'start'], ['إلى', 'end']],\n  tenders: [['العنوان', 'title'], ['الجهة', 'client'], ['الحالة', 'status etup ---------- */\nfunction setup() {\n  var ss = SpreadsheetApp.getActive(); var props = PropertiesService.getScriptProperties();\n  if (!props.getProperty('KEY')) props.setProperty('KEY', randKey());\n  TABLES.forEach(function (t) { sheetFor(t); });\n  var info = ss.getSheetByName('إعداد') || ss.insertSheet('إعداد', 0);\n  info.clear(); info.setRightToLeft(true);\n  info.getRange(1, 1, 8, 2).setValues([\n    ['نظام CRM لإدارة خدمات النظافة', ''], ['مفتاح الوصول (انسخيه إلى النظام)', props.getProperty('KEY')], ['الخطوة التالية', 'نشر ← نشر جديد ← تطبيق ويب ← أي شخص ← انسخي الرابط'],\n    ['الجداول', TABLES.map(function (t) { return TITLES[t]; }).join('، ')], ['تنبيه', 'لا تعدّلي الأعمدة id و u و x و s و json يدويًا؛ النظام يحدثها تلقائيًا'],\n    ['الصور الكبيرة', 'تُحفظ في مجلد «CRM Clean — الملفات» في Google Drive'], ['تاريخ الإعداد', new Date()], ['الإصدار', '3.0']]);\n  info.getRange('A1').setFontSize(16).setFontWeight('bold'); info.getRange('B2').setFontWeight('bold').setFontColor('#b4235f');\n  info.setColumnWidth(1, 260); info.setColumnWidth(2, 520);\n  var s1 = ss.getSheetByName('Sheet1') || ss.getSheetByName('ورقة1'); if (s1 && s1.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(s1);\n  Logger.log('Access key: ' + props.getProperty('KEY'));\n}\nfunction resetKey() { PropertiesService.getScriptProperties().setProperty('KEY', randKey()); setup(); }\nfunction onOpen() { SpreadsheetApp.getUi().createMenu('CRM').addItem('إعداد / تحديث الجداول', 'setup').addItem('تغيير مفتاح الوصول', 'resetKey').addToUi(); }\nfunction randKey() { var c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', k = ''; for (var i = 0; i < 24; i++) k += c.charAt(Math.floor(Math.random() * c.length)); return k; }\nfunction headFor(t) { var h = HEAD.slice(); (VIEW[t] || []).forEach(function (v) { h.push(v[0]); }); for (var i = 1; i <= NJSON; i++) h.push('json' + (i > 1 ? i : '')); return h; }\nfunction sheetFor(t) {\n  var ss = SpreadsheetApp.getActive(); var sh = ss.getSheetByName(t);\n  if (!sh) {\n    sh = ss.insertSheet(t); var h = headFor(t);\n    sh.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold').setBackground('#fde7f0');\n    sh.setFrozenRows(1); sh.setRightToLeft(true); sh.getRange(1, 1, sh.getMaxRows(), h.length).setNumberFormat('@');\n    sh.getRange(1, 1).setNote(TITLES[t] || t);\n  }\n  return sh;\n}\n\n/* ---------- read / write ---------- */\nfunction readTable(t) {\n  var sh = sheetFor(t); var n = sh.getLastRow(); var h = headFor(t);\n  var vals = n > 1 ? sh.getRange(2, 1, n - 1, h.length).getValues() : [];\n  return { sh: sh, h: h, vals: vals };\n}\nfunction recOf(row, h) { var j = ''; for (var i = h.length - NJSON; i < h.length; i++) j += String(row[i] || ''); try { return j ? JSON.parse(j) : null; } catch (e) { return null; } }\nfunction rowOf(t, id, u, x, s, d) {\n  var row = [id, String(u), x ? '1' : '', String(s)];\n  (VIEW[t] || []).forEach(function (v) { var val = d && d[v[1]]; row.push(val == null ? '' : String(typeof val === 'object' ? JSON.stringify(val) : val).slice(0, 500)); });\n  var j = x || !d ? '' : JSON.stringify(d); if (j.length > CHUNK * NJSON) throw new Error('record-too-large:' + t + ':' + id);\n  for (var i = 0; i < NJSON; i++) row.push(j.substr(i * CHUNK, CHUNK));\n  return row;\n}\nfunction writeTable(tb) { if (!tb.vals.length) return; tb.sh.getRange(2, 1, tb.vals.length, tb.h.length).setNumberFormat('@').setValues(tb.vals); }\nfunction push(rows) {\n  var now = Date.now(); var by = {};\n  rows.forEach(function (r) { if (TABLES.indexOf(r.t) >= 0) (by[r.t] = by[r.t] || []).push(r); });\n  Object.keys(by).forEach(function (t) {\n    var tb = readTable(t); var idx = {}; tb.vals.forEach(function (v, i) { idx[String(v[0])] = i; });\n    by[t].forEach(function (r) {\n      var id = String(r.id); var i = idx[id];\n      if (i != null && Number(tb.vals[i][1]) > Number(r.u)) return; // the sheet already has a newer edit\n      var row = rowOf(t, id, r.u, r.x, now, r.d);\n      if (i != null) tb.vals[i] = row; else { idx[id] = tb.vals.length; tb.vals.push(row); }\n    });\n    writeTable(tb);\n  });\n  return { ok: true, time: now };\n}\nfunction pull(since) {\n  var now = Date.now(); var rows = [];\n  TABLES.forEach(function (t) {\n    var tb = readTable(t);\n    tb.vals.forEach(function (v) {\n      if (!v[0] || Number(v[3]) < since - 5000) return;\n      if (v[2] === '1' || v[2] === 1) rows.push({ t: t, id: String(v[0]), u: Number(v[1]), x: 1 });\n      else { var d = recOf(v, tb.h); if (d) rows.push({ t: t, id: String(v[0]), u: Number(v[1]), d: d }); }\n    });\n  });\n  return { ok: true, rows: rows, time: now };\n}\nfunction ping() {\n  var r = readTable('requests'), s = readTable('staff');\n  return { ok: true, sheet: SpreadsheetApp.getActive().getName(), empty: !r.vals.length && !s.vals.length, time: Date.now() };\n}\nfunction alloc(kind, size, min) {\n  var p = PropertiesService.getScriptProperties(); var k = 'ctr_' + kind;\n  var start = Math.max(Number(p.getProperty(k)) || 0, min || 1); var end = start + Math.max(1, Math.min(size, 200)) - 1;\n  p.setProperty(k, String(end + 1));\n  return { ok: true, start: start, end: end };\n}\nfunction saveFile(data, name) {\n  var m = String(data || '').match(/^data:([^;]+);base64,(.+)$/); if (!m) return { ok: false, error: 'bad-file' };\n  var it = DriveApp.getFoldersByName('CRM Clean — الملفات'); var folder = it.hasNext() ? it.next() : DriveApp.createFolder('CRM Clean — الملفات');\n  var f = folder.createFile(Utilities.newBlob(Utilities.base64Decode(m[2]), m[1], (name || 'file') + '.' + (m[1].split('/')[1] || 'bin')));\n  try { f.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW); } catch (e) { /* some Workspace domains forbid public links */ }\n  return { ok: true, url: 'https://drive.google.com/thumbnail?id=' + f.getId() + '&sz=w2000' };\n}\n\n/* ---------- the public client portal (no key: limited, rate-checked) ---------- */\nfunction phone9(p) { var d = String(p || '').replace(/\\D/g, ''); return d.slice(-9); }\nfunction limited(k, max) { var c = CacheService.getScriptCache(); var n = Number(c.get(k) || 0); if (n >= max) return true; c.put(k, String(n + 1), 3600); return false; }\nfunction findRow(tb, id) { for (var i = 0; i < tb.vals.length; i++) if (String(tb.vals[i][0]).toUpperCase() === String(id).toUpperCase()) return i; return -1; }\nfunction pubRequest(req) {\n  var d = req.d || {}; var ph = phone9(d.clientPhone);\n  if (!d.clientName || ph.length < 9 || !d.district) return { ok: false, error: 'missing' };\n  if (limited('pr_' + ph, 6)) return { ok: false, error: 'too-many' };\n  return withLock(function () {\n    var now = Date.now(); var iso = new Date(now).toISOString();\n    var n = alloc('req', 1, 1001).start; var id = 'REQ-' + n;\n    var cl = readTable('clients'); var clientId = null;\n    cl.vals.forEach(function (v) { var c = recOf(v, cl.h); if (c && phone9(c.phone) === ph) clientId = c.id; });\n    if (!clientId) { clientId = 'p' + now.toString(36); cl.vals.push(rowOf('clients', clientId, now, 0, now, { id: clientId, name: String(d.clientName).slice(0, 80), type: 'individual', phone: String(d.clientPhone).slice(0, 20), address: String(d.district).slice(0, 80) })); writeTable(cl); }\n    var w = Math.max(1, Math.min(10, Number(d.workers) || 1)), h = Math.max(1, Math.min(12, Number(d.hoursEst) || 3));\n    var r = { id: id, createdAt: iso, source: 'portal', clientId: clientId, clientName: String(d.clientName).slice(0, 80), clientPhone: String(d.clientPhone).slice(0, 20), service: String(d.service || 'home').slice(0, 20), district: String(d.district).slice(0, 80), floor: String(d.floor || '').slice(0, 20), apartment: String(d.apartment || '').slice(0, 40), gps: String(d.gps || '').slice(0, 300), prefDate: String(d.prefDate || iso.slice(0, 10)).slice(0, 10), period: String(d.period || 'morning').slice(0, 12), workers: w, hoursEst: h, notes: String(d.notes || '').slice(0, 800), priority: 'normal', contractId: null, status: 'new', supervisorId: null, workerId: null, events: [{ t: 'created', at: iso }], estimate: Math.round(w * h * (Number(d.rate) || 45) * 1.15) };\n    var rq = readTable('requests'); rq.vals.push(rowOf('requests', id, now, 0, now, r)); writeTable(rq);\n    return { ok: true, id: id };\n  });\n}\nfunction pubTrack(req) {\n  if (limited('pt_' + phone9(req.phone), 120)) return { ok: false, error: 'too-many' };\n  var rq = readTable('requests'); var i = findRow(rq, req.id); if (i < 0) return { ok: false, error: 'not-found' };\n  var r = recOf(rq.vals[i], rq.h); if (!r || phone9(r.clientPhone) !== phone9(req.phone)) return { ok: false, error: 'not-found' };\n  var st = readTable('staff'); var sup = null, wk = null;\n  st.vals.forEach(function (v) { var s = recOf(v, st.h); if (!s) return; if (s.id === r.supervisorId) sup = s; if (s.id === r.workerId) wk = s; });\n  var out = { id: r.id, service: r.service, status: r.status, createdAt: r.createdAt, supAt: r.supAt, workerAt: r.workerAt, startedAt: r.startedAt, approvedAt: r.approvedAt, cancelledAt: r.cancelledAt, prefDate: r.prefDate, period: r.period, district: r.district, gps: r.gps, onwayAt: r.onwayAt, arrivedAt: r.arrivedAt, rating: r.rating || null, supName: sup ? String(sup.name).split(' ')[0] : '', workerId: r.workerId ? 'w' : null, photo: r.status === 'done' && r.photo && String(r.photo).indexOf('http') === 0 ? r.photo : null };\n  if (r.status === 'worker' && r.onwayAt && !r.arrivedAt && wk) {\n    var lc = readTable('locations'); var j = findRow(lc, wk.id);\n    if (j >= 0) { var l = recOf(lc.vals[j], lc.h); if (l && Date.now() - l.at < 20 * 60000) out.live = { lat: Math.round(l.lat * 1000) / 1000, lng: Math.round(l.lng * 1000) / 1000, at: l.at, spd: l.spd || null }; }\n  }\n  return { ok: true, r: out };\n}\nfunction pubRate(req) {\n  var stars = Math.max(1, Math.min(5, Number(req.stars) || 0)); if (!stars) return { ok: false, error: 'missing' };\n  return withLock(function () {\n    var rq = readTable(' /* ===== 99 · boot: open the device store, restore the sync queue, then draw ===== */
